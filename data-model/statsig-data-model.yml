id_conventions:
  shape: >-
    Entity IDs are caller-chosen slugs for gates, experiments and dynamic configs (the docs' own
    examples use `a_gate`, `an_experiment`), which is why "Name is already in use" is a 400 on
    create. User, group and rule identifiers are opaque 22-character base62 strings
    (e.g. 4R5PV7mvYdW6NLCwK8ocoz, 4SauZJcM1T7zNvh1igBjwE).
  prefixes: none
  most_referenced_fields: [teamID, creatorID, lastModifierID, releasePipelineID, holdoutIDs, targetingGateID, metricSourceID]
  note: >-
    teamID appears on 38 schemas and creatorID on 24 — ownership and attribution are modelled
    consistently across every entity type, which is unusual and useful.
