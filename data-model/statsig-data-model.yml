description: >-
  Entity-relationship graph derived from the 186 component schemas and the id-reference fields of
  the published Statsig Console API OpenAPI. Statsig's model has one root (the Project) and two
  intersecting spines: the CONFIGURATION spine (gate / experiment / dynamic config / layer /
  holdout / autotune, all targetable by segments and scoped by target apps) and the MEASUREMENT
  spine (metric / metric source / event / unit-ID type, which produce the results the first spine
  is judged on). Every entity is project-scoped; no ID is global.
entities:
  - name: Project
    schema: null
    description: The root container. Every API key, entity ID and rate-limit budget is project-scoped.
    id_field: projectID
  - name: Gate
    schema: ExternalGateDto
    description: A feature flag. Boolean evaluation with ordered rules, overrides and a rollout percentage.
    id_field: id
    paths: ['/console/v1/gates', '/console/v1/gates/{id}']
    lifecycle_fields: [isEnabled, status, type (TEMPORARY|PERMANENT|STALE|TEMPLATE), typeReason]
  - name: Experiment
    schema: ExternalExperimentDto
    description: An A/B or A/B/n test with groups, allocation, a scorecard of metrics and a decision.
    id_field: id
    paths: ['/console/v1/experiments', '/console/v1/experiments/{id}']
  - name: DynamicConfig
    schema: DynamicConfigDto
    description: Server-driven JSON configuration with the same rule/targeting machinery as a gate.
    id_field: id
  - name: Autotune
    schema: AutotuneExperimentDto
    description: A multi-armed bandit that reallocates traffic toward the best arm on one goal metric.
    id_field: id
  - name: Layer
    schema: ExternalLayerDto
    description: Shares parameters across mutually exclusive experiments.
    id_field: id
  - name: Holdout
    schema: HoldoutDto
    description: A withheld population used to measure cumulative impact across many features.
    id_field: id
  - name: Segment
    schema: ExternalSegmentDto
    description: A reusable user population, optionally backed by an uploaded ID list.
    id_field: id
  - name: Metric
    schema: ExternalMetricDto
    description: A measured quantity computed from events or warehouse data.
    id_field: id
  - name: MetricSource
    description: The table or event stream a metric is computed from (Warehouse Native).
    id_field: metricSourceID
  - name: Event
    description: A logged user action. Ingested at events.statsigapi.net, not managed via the Console API.
  - name: Team
    description: An organizational and permissions layer over a project; owns entities via teamID.
    id_field: teamID
  - name: TargetApp
    description: Scopes gates/configs/experiments to a named application inside one project.
    id_field: targetAppIDs
  - name: UnitIDType
    description: The randomization unit (userID, stableID, or a custom ID type).
  - name: ReleasePipeline
    description: A staged rollout plan a gate can be attached to.
    id_field: releasePipelineID
  - name: Review
    description: A proposed change to a gate/experiment/config/autotune, pending approval and commit.
    id_field: reviewID
  - name: Override
    description: A forced assignment for a user ID or a gate/segment condition.
  - name: AuditLogEntry
    description: An immutable record of a configuration change. Read-only.
  - name: Dashboard
    description: A saved set of widgets over analytics results.
    id_field: id
  - name: ParamStore
    description: Named parameters resolvable by client SDKs, mapped onto gates/configs/experiments.
  - name: ToplineAlert
    schema: null
    description: A threshold alert on a metric, with mute/unmute and an event history.
    id_field: id
  - name: APIKey
    description: A Console, Server Secret or Client SDK key. Managed through /console/v1/keys.
