rest_only:
  summary: >-
    273 of 324 Console API operations have no published MCP tool. The largest untooled groups are
    Metrics (32 ops), Experiments (Warehouse Native) (25), Segments (15), Ingestions (13), Layers
    (13), Release Pipelines (13), Holdouts (11), Users (10), Alerts (9), Settings (8), Keys (7),
    Metrics (Warehouse Native) (7), Prompts (7), Dashboards (6), Target App (6), Param Store (5),
    Roles (5), Tags (5) and Unit ID Types (5).
  note: >-
    Dashboards is the interesting case: it has no MCP tool, but Statsig ships a provider-authored
    Agent Skill (skills/statsig-dashboard/) that drives those six REST operations directly with
    Python scripts. The provider is bridging the MCP gap with skills rather than tools.
