generated: '2026-09-17'
method: derived
source: >-
  mcp/statsig-mcp.yml (provider-published tool tables at
  https://docs.statsig.com/integrations/mcp/overview) bound to
  openapi/statsig-console-api-openapi.json (https://api.statsig.com/openapi/20240601.json)
description: >-
  Binds each tool of the authenticated Statsig MCP server to the Console API operation(s) that
  back it. The Statsig MCP server is a projection of the Console API — the provider's own docs
  tell an agent to "use the get /console/v1/gates endpoint" from inside MCP — so nearly every
  tool maps onto a REST operation. The binding is by method+path rather than operationId
  BECAUSE THE PUBLISHED SPEC DECLARES NO operationId ON ANY OF ITS 324 OPERATIONS; that is a
  contract gap, recorded in conformance/ and lifecycle/, not a gap in this crosswalk.
  Confidence is `medium` throughout: the live MCP tools/list is OAuth-gated, so tools are matched
  by the provider's published name and description against the operation with the same summary,
  not by comparing schemas.
surfaces:
  openapi:
    file: openapi/statsig-console-api-openapi.json
    url: https://api.statsig.com/openapi/20240601.json
    server: https://statsigapi.net
    operations: 324
    gated: false
  mcp:
    url: https://api.statsig.com/v1/mcp
    transport: streamable-http
    gated: true
    gate: OAuth (RFC 9728 challenge on anonymous tools/list) or Console API key
  mcp_docs:
    url: https://docs.statsig.com/api/mcp
    gated: false
    note: Read-only documentation server; its 5 tools back onto no REST operation at all.
  graphql:
    present: false
coverage:
  mcp_tools_published: 56
  crosswalked: 51
  mcp_only: 8
  rest_operations: 324
  rest_operations_with_a_tool: 51
  rest_only: 273
  counting_note: >-
    56 = 51 authenticated tools enumerated in the provider's capability tables + 5 Docs MCP tools.
    One crosswalk row (Get_Autotune_Eligible_Reviewers) binds to no published path and is also
    listed under mcp_only; two rows bind to two candidate operations each.
  note: >-
    The REST surface is roughly five times the MCP surface. 256 Console API operations have no
    published tool — including the entire Ingestions, Release Pipelines, Target Apps, Unit ID
    Types, Keys, Roles, Warehouse Connections and Settings groups.
