    type: AsyncAPI
  description: >-
    The Statsig Events API handles the ingestion of event data from both client and server SDKs. It receives
    exposure events, custom events, and diagnostic data at the events.statsigapi.net endpoint. This data
    powers Statsig's experimentation analysis, product analytics, and metric computations. The Events
    API is optimized for high-throughput data ingestion, processing over a trillion events daily with
    high reliability and low latency, enabling real-time experiment monitoring and metric updates.
