description: >-
  Statsig is a product development platform that combines feature management, experimentation and
  analytics in one system. Teams gate releases behind feature flags, run A/B, A/B/n, switchback,
  holdout and multi-armed-bandit experiments, and read the impact of every change against their own
  metrics — in Statsig Cloud, which ingests and stores the event data, or Warehouse Native, which
  runs the same analysis directly against the customer's Snowflake, BigQuery, Databricks or Athena
  warehouse without moving user-level data out of it. Around that core it ships product analytics,
  web analytics, session replay, infra analytics, dynamic configs, parameter stores and 30+ SDKs.
  Its programmable surface is unusually complete: a first-party OpenAPI covering 324 Console API
  operations, a low-latency HTTP evaluation API, gRPC protobufs for the self-hosted Forward Proxy,
  an authenticated remote MCP server with OAuth, a public documentation MCP server, published
  Agent Skills, a Terraform provider and a CLI. Statsig is based in Bellevue, Washington.
tags:
  - Feature Flags
  - Experimentation
  - A/B Testing
  - Product Analytics
  - Session Replay
  - Developer Tools
  - Data Warehouse
