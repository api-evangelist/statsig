  name: statsig Console API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/statsig.png
  description: >-
    The Statsig Console API is the provider's own published contract — the CRUD API for everything
    available in console.statsig.com without the web UI. Statsig maintains an OpenAPI 3.0 document
    for it at https://api.statsig.com/openapi/20240601.json covering 208 paths and 324 operations
    across 34 resource groups: gates, experiments (including Warehouse Native), dynamic configs,
    autotunes, layers, holdouts, segments, metrics, metric sources, ingestions, release pipelines,
    dashboards, param stores, alerts, keys, roles, teams, tags, target apps and audit logs. It
    authenticates with a Console API Key in the STATSIG-API-KEY header, versions by date through
    STATSIG-API-VERSION, and is the same surface the authenticated Statsig MCP server projects.
