                    lineage:
                      events:
                      - add_to_cart
                      metrics: []
                    team: Console Team
                    unitTypes:
                    - userID
                    metricEvents:
                    - name: add_to_cart
                      type: metadata
                      criteria: []
                    permalink: https://console.statsig.com/company_id/metrics/metrics_catalog/TestMetricCapi/sum
              example:
                message: Metric created successfully.
                data:
                  id: TestMetricCapi::sum
                  name: TestMetricCapi
                  directionality: increase
                  type: sum
                  description: Capi Metric
                  isPermanent: false
