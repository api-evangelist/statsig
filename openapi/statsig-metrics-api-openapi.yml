                  team: Console Team
                  unitTypes:
                  - userID
                  metricEvents:
                  - name: add_to_cart
                    type: metadata
                    criteria: []
                  permalink: https://console.statsig.com/company_id/metrics/metrics_catalog/TestMetricCapi/sum
        '401':
          description: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 401
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Endpoint:
                  value:
                    status: 401
                    message: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
      tags:
