openapi: 3.2.0
info:
  title: Statsig Metrics API
  version: '1.0'
  description: 'Operations tagged Metrics across 2 of this provider''s published API definitions: statsig-console-api-openapi.yml, statsig-metrics-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://statsigapi.net/console/v1
  description: Statsig Console API Server
- url: https://statsigapi.net
tags:
- name: Metrics
  description: Access and manage metric definitions and metric sources used in experiment analysis.
paths:
  /metrics:
    get:
      operationId: listMetrics
      summary: List all metrics
      description: Retrieves a list of all metric definitions in the project.
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Metric'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /metrics/{id}:
    get:
      operationId: getMetric
      summary: Get a metric
      description: Retrieves the definition of a specific metric.
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The name or identifier of the metric.
      responses:
        '200':
          description: Metric details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /console/v1/metrics:
    servers:
    - url: https://statsigapi.net
    get:
      summary: Read Single Metric Value
      parameters:
      - name: id
        required: true
        in: query
        description: The unique identifier of the metric with format <metric_id>::<type>
        schema:
          type: string
      - name: date
        required: true
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      responses:
        '200':
          description: Get metric data on given date response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/MetricValuesDto'
                example:
                  message: Metric read successfully.
                  data:
                  - value: 0
                    unit_type: overall
                    numerator: null
                    denominator: null
                    metric_name: TestMetricCapi
                    metric_type: sum
                  - value: 0
                    unit_type: userID
                    numerator: null
                    denominator: null
                    metric_name: TestMetricCapi
                    metric_type: sum
              example:
                message: Metric read successfully.
                data:
                - value: 0
                  unit_type: overall
                  numerator: null
                  denominator: null
                  metric_name: TestMetricCapi
                  metric_type: sum
                - value: 0
                  unit_type: userID
                  numerator: null
                  denominator: null
                  metric_name: TestMetricCapi
                  metric_type: sum
        '401':
          description: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 401
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Endpoint:
                  value:
                    status: 401
                    message: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
      tags:
      - Metrics
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1Metrics
      x-operation-id-source: derived
    post:
      summary: Create Metric
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricCreationContractDto'
      responses:
        '201':
          description: Create metric response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/ExternalMetricDefinitionContractDto'
                example:
                  message: Metric created successfully.
                  data:
                    id: TestMetricCapi::sum
                    name: TestMetricCapi
                    directionality: increase
                    type: sum
                    description: Capi Metric
                    isPermanent: false
                    isReadOnly: false
                    isHidden: false
                    isVerified: false
                    tags: []
                    creatorName: CONSOLE API
                    creatorEmail: null
