  /console/v1/metrics/{id}/experiments:
    servers:
    - url: https://statsigapi.net
    get:
      summary: 'Lineage: List experiments related to Metric'
      parameters:
      - name: id
        required: true
        in: path
        description: id
        schema:
          type: string
      - name: layerID
        required: false
        in: query
        description: Which layer to place the experiment into.
        schema:
          type: string
      - name: idType
        required: false
        in: query
        description: The idType the experiment will be performed on
        schema:
          type: string
      - name: teamID
        required: false
        in: query
        description: The team ID associated with the experiment, Enterprise only.
        schema:
          type:
          - string
          - 'null'
      - name: status
        required: false
        in: query
        description: The current status of the experiment
        schema:
          oneOf:
          - type: string
            enum:
            - active
            - setup
            - decision_made
            - abandoned
            - archived
            - experiment_stopped
            - assignment_stopped
          - type: array
            items:
              type: string
              enum:
              - active
              - setup
              - decision_made
              - abandoned
              - archived
              - experiment_stopped
              - assignment_stopped
      - name: targetAppID
        required: false
        in: query
        schema:
          type: string
      - name: stale
        required: false
        in: query
        description: When true, only returns stale experiments. If omitted or false, returns all experiments.
        schema:
          type: boolean
      - name: createdStartDate
        required: false
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      - name: createdEndDate
        required: false
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      - name: experimentType
        required: false
        in: query
        description: Filter by experiment type
        schema:
          oneOf:
          - type: string
            enum:
            - BASE
            - GEO
            - SWITCHBACK
            - PROMPT
            - SIDECAR
            - GRID_SEARCH
          - type: array
            items:
              type: string
              enum:
              - BASE
              - GEO
              - SWITCHBACK
              - PROMPT
              - SIDECAR
              - GRID_SEARCH
      - name: ids
        required: false
        in: query
        description: Fetch a specific set of experiments by ID in a single request (comma-separated, max 100). Only experiments matching these IDs are returned; unknown IDs are omitted. For more than 100, split into batches of 100. Combine with `fields` to fetch trimmed details for several experiments at once.
        examples:
          single id:
            value: experiment_a
          multiple ids:
            value: experiment_a,experiment_b
        schema:
          maxItems: 100
          type: array
          items:
            type: string
      - name: fields
        required: false
        in: query
        description: Comma-separated list of top-level fields to return (sparse fieldset), e.g. `id,name,hypothesis,groups`. `id` is always included. Reduces response size; when omitted the full experiment is returned.
        examples:
          single field:
            value: hypothesis
          multiple fields:
            value: id,name,hypothesis,groups
        schema:
          type: array
          items:
            type: string
      - name: creatorName
        required: false
        in: query
        description: Name of the creator.
        schema:
          type:
          - string
          - 'null'
      - name: creatorID
        required: false
        in: query
        description: ID of the user who created the entity.
        schema:
          type:
          - string
          - 'null'
      - name: tags
        required: false
        in: query
        description: Filter by tags
        examples:
          single tag:
            value: tag1
          multiple tags:
            value:
            - tag1
            - tag2
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      responses:
        '200':
          description: List experiments using metric response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ExternalExperimentDto'
                example:
                  message: Metrics listed successfully.
                  data:
                  - id: '    ::sum'
                    name: '    '
                    directionality: increase
                    type: sum
                    description: ''
                    isPermanent: false
                    isReadOnly: false
                    isHidden: false
                    isVerified: false
                    tags: []
                    creatorName: Test User
                    creatorEmail: test@statsig.com
                    createdTime: 1709580516933
                    owner:
                      name: John Doe
                      ownerID: user123
                      ownerType: USER
                      ownerName: John Doe
                      ownerEmail: owner123@test.com
                    lineage:
                      events:
                      - add_to_cart
                      metrics: []
                    team: test
                    unitTypes:
                    - room_id
                    metricEvents:
                    - name: add_to_cart
                      type: value
                      criteria: []
                    permalink: https://console.statsig.com/company_id/metrics/metrics_catalog/%20%20%20%20/sum
                  - id: '      ::ratio'
