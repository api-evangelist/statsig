  /console/v1/dashboards/{id}/widgets/{widgetId}/results:
    get:
      summary: Read Dashboard Widget Results
      parameters:
      - name: id
        required: true
        in: path
        description: dashboard id
        schema:
          type: string
      - name: widgetId
        required: true
        in: path
        description: widget id
        schema:
          type: string
      - name: sampling_enabled
        required: false
        in: query
        description: Whether funnel sampling should be enabled for this results query. Defaults to true.
        schema:
          example: true
          type: boolean
      responses:
        '200':
          description: Read dashboard widget results response. Currently only supported for funnel widgets.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/DashboardWidgetResultsResponseDto'
                example:
                  message: Dashboard Read Successfully
                  data:
                    id: widget_id
                    type: funnel
                    funnel:
                      datasets:
                      - key: default
                        steps:
                        - rank: 0
                          name: signup
                          count: 100
                          conversion_rate: 1
                          previous_step_conversion_rate: 1
                        - rank: 1
                          name: purchase
                          count: 42
                          conversion_rate: 0.42
                          previous_step_conversion_rate: 0.42
              example:
                message: Dashboard Read Successfully
                data:
                  id: widget_id
                  type: funnel
                  funnel:
                    datasets:
                    - key: default
                      steps:
