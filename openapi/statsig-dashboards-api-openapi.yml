openapi: 3.2.0
info:
  title: Console Dashboards API
  description: The "Console API" is the CRUD API for performing the actions offered on console.statsig.com without needing to go through the web UI.
  version: 20240601.0.0
  contact: {}
servers:
- url: https://statsigapi.net
tags:
- name: Dashboards
paths:
  /console/v1/dashboards:
    get:
      summary: List Dashboards
      parameters:
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: search
        required: false
        in: query
        description: Filter dashboards by name using a partial match.
        schema:
          minLength: 1
          example: growth
          type: string
      responses:
        '200':
          description: List dashboards response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/DashboardListItemResponseDto'
                example:
                  message: Dashboards Listed Successfully
                  data:
                  - id: dashboard_id
                    name: My Dashboard
                    description: desc
                    defaults:
                      date:
                        value: 14
                        unit: day
                      granularity: daily
                    created_time: 1736208000
                    modified_time: 1736294400
                    widget_count: 1
                    is_verified: true
                  pagination:
                    itemsPerPage: 20
                    pageNumber: 1
                    nextPage: null
                    previousPage: null
                    totalItems: 1
                    all: /console/v1/dashboards
              example:
                message: Dashboards Listed Successfully
                data:
                - id: dashboard_id
                  name: My Dashboard
                  description: desc
                  defaults:
                    date:
                      value: 14
                      unit: day
                    granularity: daily
                  created_time: 1736208000
                  modified_time: 1736294400
                  widget_count: 1
                  is_verified: true
                pagination:
                  itemsPerPage: 20
                  pageNumber: 1
                  nextPage: null
                  previousPage: null
                  totalItems: 1
                  all: /console/v1/dashboards
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Dashboards
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1Dashboards
      x-operation-id-source: derived
    post:
      summary: Create Dashboard
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardDto'
      responses:
        '200':
          description: Create dashboard response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/DashboardCreateResponseDto'
                example:
                  message: Dashboard Created Successfully
                  data:
                    id: dashboard_id
                    dashboard_url: https://console.statsig.com/company_id/dashboards/dashboard_id
              example:
                message: Dashboard Created Successfully
                data:
                  id: dashboard_id
                  dashboard_url: https://console.statsig.com/company_id/dashboards/dashboard_id
      tags:
      - Dashboards
      security:
      - STATSIG-API-KEY: []
      operationId: postConsoleV1Dashboards
      x-operation-id-source: derived
  /console/v1/dashboards/{id}:
    get:
      summary: Read Dashboard
      parameters:
      - name: id
        required: true
        in: path
        description: id
        schema:
          type: string
      responses:
        '200':
          description: Read dashboard response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/DashboardReadResponseDto'
                example:
                  message: Dashboard Read Successfully
                  data:
                    id: dashboard_id
                    name: My Dashboard
                    description: desc
                    defaults:
                      date:
                        value: 14
                        unit: day
                      granularity: daily
                    widgets:
                    - id: widget_id
                      type: header
                      title: Overview
                      width: 12
                      height: 1
              example:
                message: Dashboard Read Successfully
                data:
                  id: dashboard_id
                  name: My Dashboard
                  description: desc
                  defaults:
                    date:
                      value: 14
                      unit: day
                    granularity: daily
                  widgets:
                  - id: widget_id
                    type: header
                    title: Overview
                    width: 12
                    height: 1
        '400':
          description: Invalid request. Please check the request input and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 400
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Request:
                  value:
                    status: 400
                    message: Invalid request. Please check the request input and try again.
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Dashboards
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1DashboardsById
      x-operation-id-source: derived
