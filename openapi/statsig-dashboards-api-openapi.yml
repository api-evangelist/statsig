                    data:
                      $ref: '#/components/schemas/DashboardReplaceWidgetsResponseDto'
                example:
                  message: Dashboard Widgets Replaced Successfully
                  data:
                    ids:
                    - widget_id
              example:
                message: Dashboard Widgets Replaced Successfully
                data:
                  ids:
                  - widget_id
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
