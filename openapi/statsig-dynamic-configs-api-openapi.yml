        description: Filter by team ID
        schema:
          type: string
      - name: targetAppID
        required: false
        in: query
        description: Filter by target app ID
        schema:
          type: string
      - name: type
        required: false
        in: query
        description: Filter by lifecycle type (TEMPORARY, PERMANENT, or STALE). Results depend on the nightly stale detection batch job having run.
        schema:
          type: string
          enum:
          - TEMPORARY
          - PERMANENT
          - STALE
      - name: typeReason
        required: false
        in: query
        description: Filter by stale classification reason. Results depend on the nightly stale detection batch job having run.
        schema:
          type: string
          enum:
          - NONE
          - STALE_PROBABLY_DEAD_CHECK
          - STALE_NO_RULES
          - STALE_PROBABLY_FORGOTTEN
          - STALE_PROBABLY_LAUNCHED
          - STALE_PROBABLY_UNLAUNCHED
      - name: creatorName
        required: false
        in: query
        description: Name of the creator.
        schema:
          type:
          - string
          - 'null'
      - name: creatorID
        required: false
        in: query
        description: ID of the user who created the entity.
        schema:
          type:
          - string
          - 'null'
      - name: tags
        required: false
        in: query
        description: Filter by tags
        examples:
          single tag:
            value: tag1
          multiple tags:
            value:
            - tag1
            - tag2
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
