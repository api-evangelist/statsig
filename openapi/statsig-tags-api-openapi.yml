openapi: 3.2.0
info:
  title: Statsig Tags API
  version: '1.0'
  description: 'Operations tagged Tags across 2 of this provider''s published API definitions: statsig-console-api-openapi.yml, statsig-tags-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://statsigapi.net/console/v1
  description: Statsig Console API Server
- url: https://statsigapi.net
tags:
- name: Tags
paths:
  /tags:
    get:
      operationId: listTags
      summary: List all tags
      description: Retrieves a list of all tags used for organizing entities in the project.
      tags:
      - Tags
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    post:
      operationId: createTag
      summary: Create a tag
      description: Creates a new tag for organizing entities in the project.
      tags:
      - Tags
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: Tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /console/v1/tags:
    servers:
    - url: https://statsigapi.net
    get:
      summary: List Tags
      parameters:
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      responses:
        '200':
          description: List Tags Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/TagDto'
                example:
                  message: Tags listed successfully
                  data:
                  - id: string
                    name: a tag
                    description: a description
                    isCore: false
              example:
                message: Tags listed successfully
                data:
                - id: string
                  name: a tag
                  description: a description
                  isCore: false
        '404':
          description: Tag not found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Tags
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1Tags
      x-operation-id-source: derived
    post:
      summary: Create Tag
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateDto'
      responses:
        '200':
          description: Create Tag Response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/TagDto'
                example:
                  message: Tag created successfully
                  data:
                    id: string
                    name: a tag
                    description: a description
                    isCore: false
              example:
                message: Tag created successfully
                data:
                  id: string
                  name: a tag
                  description: a description
                  isCore: false
      tags:
      - Tags
      security:
      - STATSIG-API-KEY: []
      operationId: postConsoleV1Tags
      x-operation-id-source: derived
  /console/v1/tags/{id}:
    servers:
    - url: https://statsigapi.net
    get:
      summary: Read Tag
      parameters:
      - name: id
        required: true
        in: path
        description: Opaque tag ID returned by tag creation, or the tag name. Exact ID matches take precedence over name matches.
        schema:
          type: string
      responses:
        '200':
          description: Read Tag Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/TagDto'
                example:
                  message: Tag read successfully
                  data:
                    id: string
                    name: a tag
                    description: a description
                    isCore: false
              example:
                message: Tag read successfully
                data:
                  id: string
                  name: a tag
                  description: a description
                  isCore: false
        '404':
          description: Tag not found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Tags
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1TagsById
      x-operation-id-source: derived
    patch:
      summary: Update Tag
      parameters:
      - name: id
        required: true
        in: path
        description: Opaque tag ID returned by tag creation, or the tag name. Exact ID matches take precedence over name matches.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateDto'
      responses:
        '200':
          description: Update Tag Response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/TagDto'
                example:
                  message: Tag updated successfully
                  data:
                    id: string
                    name: a tag
                    description: a description
                    isCore: false
              example:
                message: Tag updated successfully
                data:
                  id: string
                  name: a tag
                  description: a description
                  isCore: false
      tags:
      - Tags
      security:
      - STATSIG-API-KEY: []
      operationId: patchConsoleV1TagsById
      x-operation-id-source: derived
    delete:
      summary: Delete Tag
      parameters:
      - name: id
        required: true
        in: path
        description: Opaque tag ID returned by tag creation, or the tag name. Exact ID matches take precedence over name matches.
        schema:
          type: string
      responses:
        '200':
          description: Delete tag response
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                example:
                  message: Tag deleted successfully
              example:
                message: Tag deleted successfully
      tags:
      - Tags
      security:
      - STATSIG-API-KEY: []
      operationId: deleteConsoleV1TagsById
      x-operation-id-source: derived
components:
  schemas:
    Tag:
      type: object
      description: A tag used for organizing and categorizing entities.
      properties:
        id:
          type: string
          description: The unique identifier of the tag.
        name:
          type: string
          description: The name of the tag.
        description:
          type: string
          description: A human-readable description.
        color:
          type: string
          description: The color associated with the tag for display.
    TagCreate:
      type: object
      description: Request body for creating a new tag.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the tag to create.
        description:
          type: string
          description: A human-readable description.
        color:
          type: string
          description: The color for the tag.
    PaginationResponseWithMessage:
      type: object
      properties:
        message:
          type: string
          description: A simple string explaining the result of the operation.
        data:
          description: Array of results returned by pagination limit.
          type: array
          items:
            type: object
        pagination:
          description: Pagination metadata for checking if there is next page for example.
          allOf:
          - $ref: '#/components/schemas/PaginationResponseMetadataDto'
      required:
      - message
      - data
      - pagination
    TagCreateDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
        description:
          type: string
          maxLength: 1000
        isCore:
          default: false
          type: boolean
      required:
      - name
      - description
      example:
        name: my_tag
        description: my tag description
        isCore: true
    SingleDataResponse:
      type: object
      properties:
        message:
          type: string
          description: A simple string explaining the result of the operation.
        data:
          type: object
          description: A single result.
      required:
      - message
      - data
    TagDto:
      type: object
      properties:
        id:
          type: string
          example: string
          description: id of the tag
        name:
          type: string
          example: a tag
          description: name of the tag
        description:
          type: string
          example: a description
          description: description of the tag
        isCore:
          type: boolean
          example: false
          description: is this a core tag
      required:
      - id
      - name
      - description
      - isCore
    TagUpdateDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
        description:
          type: string
          maxLength: 1000
        isCore:
          default: false
          type: boolean
    PaginationResponseMetadataDto:
      type: object
      properties:
        itemsPerPage:
          type: number
          format: double
        pageNumber:
          type: number
          format: double
        nextPage:
          type:
          - string
          - 'null'
        previousPage:
          type:
          - string
          - 'null'
        totalItems:
          type: number
          format: double
        all:
          type: string
      required:
      - itemsPerPage
      - pageNumber
      - nextPage
      - previousPage
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error message describing what was wrong with the request.
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error message describing the authentication failure.
  parameters:
    ApiVersion:
      name: STATSIG-API-VERSION
      in: header
      required: false
      schema:
        type: string
        default: '20240601'
      description: The Console API version. Currently the only version is 20240601.
  securitySchemes:
    consoleApiKey:
      type: apiKey
      in: header
      name: STATSIG-API-KEY
      description: Console API Key created in Project Settings > API Keys tab. Required for all Console API requests.
    STATSIG-API-KEY:
      type: apiKey
      name: STATSIG-API-KEY
      in: header
externalDocs:
  description: Statsig Console API Documentation
  url: https://docs.statsig.com/console-api/
x-refined-from:
- statsig-console-api-openapi.yml
- statsig-tags-api-openapi.yml
