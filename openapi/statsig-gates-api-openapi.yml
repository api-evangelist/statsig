                  type: PERMANENT
                  typeReason: NONE
                  team: null
                  reviewSettings:
                    requiredReview: false
                    allowedReviewers: []
                  measureMetricLifts: true
                  store0100Exposures: false
                  owner:
                    ownerID: user123
                    ownerName: CONSOLE API
                    ownerType: SDK_KEY
                    ownerEmail: ''
                  monitoringMetrics: []
                  version: 1
                  permalink: https://console.statsig.com/company_id/gates/a_gate
                pagination:
                  all: ''
