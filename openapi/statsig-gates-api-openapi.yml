            type: object
            properties:
              criteriaName:
                oneOf:
                - type: string
                  enum:
                  - HYPOTHESIS_LENGTH
                  - BALANCED_EXPOSURE
                  - PRIMARY_METRICS_LENGTH
                  - SECONDARY_METRICS_LENGTH
                  - COMPARISON_CORRECTION
                  - GUARDRAIL_METRIC_TAGS
                  - SUFFICIENT_SAMPLE
                  - POWER_ANALYSIS
                  - SEQUENTIAL_TESTING
                - type: string
              status:
