        '403':
          description: Forbidden resource
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    enum:
                    - 403
                  message:
                    type: string
                    enum:
                    - Forbidden resource
                required:
                - status
                - message
              examples:
                Forbidden resource:
                  value:
                    status: 403
                    message: Forbidden resource
      tags:
      - Gates
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1Gates
      x-operation-id-source: derived
    post:
      summary: Create Gate
      parameters:
      - name: includeArchiveMetadata
        required: false
        in: query
        description: When "true", populate archivedAt / archivedBy* / archiveReason on the gate when it is currently archived. When omitted or "false", those fields are absent from the response.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      requestBody:
        required: true
