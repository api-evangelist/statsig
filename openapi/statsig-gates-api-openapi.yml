  /console/v1/gates/{id}:
    servers:
    - url: https://statsigapi.net
    get:
      summary: Read Gate
      parameters:
      - name: id
        required: true
        in: path
        description: id
        schema:
          type: string
      - name: includeArchiveMetadata
        required: false
        in: query
        description: When "true", populate archivedAt / archivedBy* / archiveReason on the gate when it is currently archived. When omitted or "false", those fields are absent from the response.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Get gate response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/ExternalGateDto'
                example:
                  message: Gate read successfully.
                  data:
                    id: a_gate
                    name: A Gate
                    description: description
