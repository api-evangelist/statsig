components:
  schemas:
    ExternalMetricDefinitionContractDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the metric, serving as its primary identifier.
          example: metricName
        type:
          type: string
          enum:
          - ratio
          - sum
          - composite
          - mean
          - event_count_custom
          - event_user
          - event_user_window
          - funnel
          - undefined
          - setup_incomplete
          - composite_sum
          - import_window
          - user_warehouse
          - hybrid_warehouse
          - count_distinct
          - ads_segment_active_users
          - ads_segment_exposed_user_days
          - percentile
          - latest_value
          description: The type of the metric, defining its aggregation method and characteristics.
          example: sum
        isVerified:
          type: boolean
          description: Marks the metric as verified, indicating trustworthiness within the organization.
          example: false
        isReadOnly:
          type: boolean
          description: Set to true to make the metric definition editable only through the Console API.
          example: false
        unitTypes:
          type: array
          items:
            type: string
          description: Array of unit types associated with the metric, such as stableID or userID.
          example:
          - stableID
          - userID
        metricEvents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the metric event.
              type:
                type:
                - string
                - 'null'
                enum:
                - count
                - count_distinct
                - value
                - metadata
                description: 'Aggregation type for the metric event. Allowed values: count, count_distinct, value, metadata. For ratio metrics, only count and count_distinct are valid. Do not confuse with criteria[].type, which is a filter condition type.'
              metadataKey:
                type: string
                description: The key for associated metadata, if applicable.
              criteria:
                type: array
                items:
                  description: Array of event criteria for defining filtering conditions in metrics analysis.
                  $ref: '#/components/schemas/MetricEventsCriteriaDto'
                description: Filtering criteria for the metric event, including conditions and values to refine the event data.
            required:
            - name
          description: An array of event definitions used to compute the metric. For ratio metrics, each event must use count or count_distinct aggregation.
          example:
          - name: event1
            type: value
        metricComponentMetrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
            required:
            - name
            - type
          description: List of input metrics used to calculate the new metric for composite types.
          example: []
        description:
          type: string
          description: An optional description providing additional context about the metric.
          example: the description of this metric
        directionality:
          type: string
          enum:
          - increase
          - decrease
          description: Specifies the desired directionality for the metric, indicating whether an increase or decrease is favorable.
          example: increase
        tags:
          type: array
          items:
            type: string
          description: Optional tags for categorizing the metric and improving searchability.
          example:
          - tag1
          - tag2
        isPermanent:
          type: boolean
          description: Indicates whether the metric is permanent and should not be deleted.
          example: false
        rollupTimeWindow:
          type: string
          description: Time window for the metric rollup. Specify "custom" for a customized time window.
          example: custom
        customRollUpStart:
          type: number
          description: Custom time window start date in days since exposure.
          example: 1
          format: double
        customRollUpEnd:
          type: number
          description: Custom time window end date in days since exposure.
          example: 1
          format: double
        percentile:
          type: number
          minimum: 0.001
          maximum: 0.999
          description: Percentile value for percentile metrics.
          example: 0.95
          format: double
        funnelEventList:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the funnel event used in the metric.
                example: event1
              type:
                type: string
                enum:
                - event_dau
                - event_user
                - event_count
                - event_count_custom
                description: The type of funnel event, specifying how the event is tracked.
                example: event_dau
            required:
            - name
            - type
          description: List of events used to create funnel metrics.
        funnelCountDistinct:
          type: string
          enum:
          - events
          - users
          description: Specifies whether to count events or distinct users for the funnel metric.
        warehouseNative:
          type: object
          properties:
            aggregation:
              type: string
              enum:
              - count
              - sum
              - mean
              - daily_participation
              - ratio
              - funnel
              - count_distinct
              - percentile
              - first_value
              - latest_value
              - retention
              - max
              - min
              - composite
              - ''
              description: 'Allowed: count┃sum┃mean┃daily_participation┃ratio┃funnel┃count_distinct┃percentile┃first_value┃latest_value┃retention┃max┃min┃composite'
            metricSourceName:
              type: string
              description: 'Deprecated: use `metricSources` instead. If provided, this will overwrite all metric sources. For Count, Sum, Mean, User Count aggregation types: the name of metric source'
            criteria:
              type: array
              items:
                description: Array of event criteria for defining filtering conditions in metrics analysis.
                $ref: '#/components/schemas/MetricEventsCriteriaDto'
              description: 'Deprecated: use `metricSources` instead. If provided with `metricSourceName`, this will overwrite all metric sources. Filtering criteria for the metric source'
            metricSources:
              type: array
              items:
                type: object
                properties:
                  metricSourceName:
                    type: string
                  criteria:
                    type: array
                    items:
                      description: Array of event criteria for defining filtering conditions in metrics analysis.
                      $ref: '#/components/schemas/MetricEventsCriteriaDto'
                    description: Filtering criteria for the metric source
                  valueColumn:
                    type: string
                required:
                - metricSourceName
                - criteria
              description: List of metric sources for this metric.
            waitForCohortWindow:
              type: boolean
            denominatorCriteria:
              type: array
              items:
                description: Array of event criteria for defining filtering conditions in metrics analysis.
                $ref: '#/components/schemas/MetricEventsCriteriaDto'
              description: Filtering criteria for the denominator metric source for a ratio, or the start event for a retention metric if useSecondaryRetentionEvent is set
            denominatorAggregation:
              type: string
              enum:
              - count
              - sum
              - mean
              - daily_participation
              - ratio
              - funnel
              - count_distinct
              - percentile
              - first_value
              - latest_value
              - retention
              - max
              - min
              - composite
              - ''
              description: 'Aggregation for the ratio denominator. Allowed: `count`┃`sum`┃`daily_participation`┃`count_distinct`┃`first_value`┃`latest_value`┃`max`┃`min`.'
            denominatorCustomRollupEnd:
              type: number
              description: Custom end window for ratio denominator unit count metrics with "custom" rollup time window. Measured in days or minutes depending on the "denominatorCustomRollupMeasureInMinutes" flag.
              format: double
            denominatorCustomRollupStart:
              type: number
              description: Custom start window for ratio denominator unit count metrics with "custom" rollup time window. Measured in days or minutes depending on the "denominatorCustomRollupMeasureInMinutes" flag.
              format: double
            denominatorMetricSourceName:
              type: string
              description: Name of the metric source for the denominator of a ratio, or the start event for a retention metric if useSecondaryRetentionEvent is set
            denominatorRollupTimeWindow:
              type: string
              description: 'Rollup-mode for ratio denominator unit count metrics. Allowed values: "daily" for daily participation rate, "max" for one-time event, "custom" for a custom attribution window'
            denominatorValueColumn:
              type: string
              description: Column name for the denominator’s value.
            funnelCalculationWindow:
              type: integer
              minimum: 0
              description: Duration for counting funnel events in days.
              format: int64
            funnelCountDistinct:
              type: string
              enum:
              - sessions
              - users
              description: 'Allowed: users┃sessions for distinct count method in funnel events.'
            funnelEvents:
              type: array
              items:
                type: object
                properties:
                  criteria:
                    type: array
                    items:
                      description: Array of event criteria for defining filtering conditions in metrics analysis.
                      $ref: '#/components/schemas/MetricEventsCriteriaDto'
                    description: Optional array of criteria to filter the funnel events, defined by various types and conditions.
                  metricSourceName:
                    type: string
                    description: Optional name of the metric source associated with the funnel event.
                  name:
                    type:
                    - string
                    - 'null'
