openapi: 3.2.0
info:
  title: Console Metrics (Warehouse Native) API
  description: The "Console API" is the CRUD API for performing the actions offered on console.statsig.com without needing to go through the web UI.
  version: 20240601.0.0
  contact: {}
servers:
- url: https://statsigapi.net
tags:
- name: Metrics (Warehouse Native)
paths:
  /console/v1/metrics/{id}/reload:
    post:
      summary: Reload metric data
      parameters:
      - name: id
        required: true
        in: path
        description: id
        schema:
          type: string
      - name: incremental
        required: false
        in: query
        description: Incremental reload of the metric
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Reload metric data response
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                example:
                  message: Metric data reloaded successfully.
              example:
                message: Metric data reloaded successfully.
        '401':
          description: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 401
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Endpoint:
                  value:
                    status: 401
                    message: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Metrics (Warehouse Native)
      security:
      - STATSIG-API-KEY: []
      operationId: postConsoleV1MetricsByIdReload
      x-operation-id-source: derived
