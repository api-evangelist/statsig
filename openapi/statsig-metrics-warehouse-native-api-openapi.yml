              - start_event
              - exposure
              description: 'Allowed: start_event┃exposure to determine funnel start criteria.'
            metricDimensionColumns:
              type: array
              items:
                type: string
              description: Specify metadata columns for breaking down metric analysis.
            metricDimensionLimits:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Name of the metadata dimension to apply a breakdown limit.
                  limit:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Maximum number of values to retain for this dimension (0-100).
                    example: 10
                required:
                - name
                - limit
              description: Per-dimension breakdown limits; values beyond the limit are grouped into OTHER.
            metricBakeDays:
              type: integer
              minimum: 0
              description: Number of days for metric baking; specify duration for analysis.
              format: int64
            loadingWindow:
              type: integer
              minimum: 0
              description: Lookback window in days for loading metric data. Defaults to 90 days.
              example: 90
              format: int64
            numeratorAggregation:
              type: string
              enum:
              - count
              - sum
              - mean
              - daily_participation
              - ratio
              - funnel
              - count_distinct
              - percentile
              - first_value
              - latest_value
              - retention
              - max
              - min
              - composite
              - ''
              description: 'Aggregation for the ratio numerator. Allowed: `count`┃`sum`┃`daily_participation`┃`count_distinct`┃`first_value`┃`latest_value`┃`max`┃`min`.'
            valueColumn:
              type: string
              description: 'Deprecated: use `metricSources` instead. If provided with `metricSourceName`, this will overwrite all metric sources. Column name representing the metric’s value.'
            valueThreshold:
              type: number
              description: Threshold value for filtering metrics.
              format: double
            allowNullRatioDenominator:
              type: boolean
              description: Include units which do not have a denominator. Only applicable to ratios.
            funnelStrictOrdering:
              type: boolean
            funnelUseExposureAsFirstEvent:
              type: boolean
            funnelTimestampAllowanceMs:
              type: number
              format: double
            funnelTimeToConvert:
              type: boolean
            winsorizationHigh:
              type: number
              maximum: 1
              minimum: 0
              description: High threshold for winsorization; must be between 0 and 1.
              format: double
            winsorizationLow:
              type: number
              maximum: 1
              minimum: 0
              description: Low threshold for winsorization; must be between 0 and 1.
              format: double
            winsorizationHighDenominator:
              type: number
              maximum: 1
              minimum: 0
              format: double
            winsorizationLowDenominator:
              type: number
              maximum: 1
              minimum: 0
              format: double
            cupedAttributionWindow:
              type:
              - integer
              - 'null'
              minimum: 0
              description: Attribution window for CUPED adjustments in days.
              format: int64
            rollupTimeWindow:
              type: string
              description: 'Rollup-mode for unit count metrics. Allowed values: "daily" for daily participation rate, "max" for one-time event, "custom" for a custom attribution window'
            customRollUpStart:
              type: integer
              minimum: 0
              description: Custom start window for unit count metrics with "custom" rollup time window, or for other metrics with the "Use Cohort Window in Experiments" option on enabled. Measured in days or minutes depending on the "customRollupMeasureInMinutes" flag.
              format: int64
            customRollUpEnd:
              type: integer
              minimum: 0
              description: Custom end window for unit count metrics with "custom" rollup time window, or for other metrics with the "Use Cohort Window in Experiments" option on enabled. Measured in days or minutes depending on the "customRollupMeasureInMinutes" flag.
              format: int64
            onlyIncludeUsersWithConversionEvent:
              type: boolean
              description: Flag to include only users with a conversion event in the metric.
            denominatorCustomRollupMeasureInMinutes:
              type: boolean
              description: Flag to measure the denominator custom rollup window in minutes instead of days.
            customRollupMeasureInMinutes:
              type: boolean
              description: Flag to measure the custom rollup window in minutes instead of days.
            percentile:
              type: number
              maximum: 0.999
              minimum: 0.001
              description: Percentile value for statistical calculations.
              format: double
            useLogTransform:
              type: boolean
              description: Use log transform for the metric.
            useSecondaryRetentionEvent:
              type: boolean
              description: Use a different start and completion event for retention calculations.
            retentionEnd:
              type: integer
              description: Retention end in days.
              format: int64
              exclusiveMinimum: 0
            retentionLength:
              type: integer
              description: Retention lookback window in days.
              format: int64
              exclusiveMinimum: 0
            logTransformBase:
              type:
              - number
              - 'null'
              description: Log transform base to be used for the metric.
              format: double
              exclusiveMinimum: 0
            cap:
              type: number
              description: Maximum cap for metric values.
              format: double
            surrogateMetricMSE:
              type:
              - number
              - 'null'
              description: Mean Squared Error for surrogate metric.
              format: double
            components:
              type: array
              items:
                type: object
                properties:
                  operator:
                    type: string
                    enum:
                    - +
                    - '-'
                    description: Operator for this component
                  aggregation:
                    type: string
                    enum:
                    - count
                    - sum
                    - mean
                    - daily_participation
                    - ratio
                    - funnel
                    - count_distinct
                    - percentile
                    - first_value
                    - latest_value
                    - retention
                    - max
                    - min
                    - composite
                    - ''
                    description: Aggregation type for this component
                  metricSourceName:
                    type: string
                    description: Metric source name for this component
                  name:
                    type:
                    - string
                    - 'null'
                    description: Optional name for this component
                  criteria:
                    type: array
                    items:
                      description: Array of event criteria for defining filtering conditions in metrics analysis.
                      $ref: '#/components/schemas/MetricEventsCriteriaDto'
                    description: Optional filtering criteria for this component
                  valueColumn:
                    type: string
                    description: Value column for this component
                required:
                - operator
              description: Components for composite metrics, defining each component of the formula
          description: Defines warehouse native metrics for advanced configurations.
        team:
          type:
          - string
          - 'null'
          description: The team associated with the metric, applicable for enterprise environments.
        teamID:
          type:
          - string
          - 'null'
          description: The team ID associated with the metric, applicable for enterprise environments.
        dryRun:
          type: boolean
          description: Skips persisting the metric (used to validate that inputs are correct)
        id:
          type: string
          description: Unique identifier for the metric, used for referencing within the system.
          example: metricId
        isHidden:
          type: boolean
          description: Indicates if the metric is hidden from the user interface.
          example: false
        lineage:
          type: object
          properties:
            events:
              type: array
              items:
                type: string
              description: List of event names that contribute to the metric’s calculation.
              example:
              - event1
              - event2
            metrics:
              type: array
              items:
                type: string
              description: List of metric names that are part of this metric’s lineage.
              example:
              - metric1
              - metric2
          required:
          - events
          - metrics
        creatorName:
          type:
          - string
          - 'null'
          description: Name of the person who created the metric, if available.
          example: creatorName
        creatorEmail:
          type:
          - string
          - 'null'
          description: Email address of the metric creator for contact purposes.
          example: creatorEmail
        createdTime:
          type: number
          description: Timestamp indicating when the metric was created.
          example: 1716230400
          format: double
        lastModifierID:
          type:
          - string
          - 'null'
          description: ID of the last modifier.
        lastModifiedTime:
          type:
          - number
          - 'null'
          description: Time of the last modification to this metric.
          format: double
        lastModifierEmail:
          type:
          - string
          - 'null'
          description: Email of the last modifier.
        lastModifierName:
          type:
          - string
          - 'null'
          description: Name of the last modifier.
        scheduledReloadHour:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 23
          description: Warehouse Native only - UTC hour at which to run scheduled metric reloads.
          format: int64
        scheduledReloadDays:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Warehouse Native only - days on which to run scheduled metric reloads from 0 to 6, 0 meaning Sunday. Null to run reloads on all days.
        owner:
          type: object
          properties:
            ownerID:
              type: string
              description: ID of the owner
              example: abc123
            ownerType:
              type: string
              description: Type of the owner (e.g., SDK_KEY or USER)
              example: USER
            ownerName:
              type: string
              description: The name of the owner. This field is optional.
              example: John Doe
            ownerEmail:
              type: string
              description: The email of the owner. This field is optional.
          description: Schema for owner data including ID, type, name.
          example:
            ownerID: user123
            ownerType: USER
            ownerName: John Doe
            ownerEmail: owner123@test.com
        permalink:
          type: string
          format: uri
          description: A permalink to this metric in the Statsig Console.
      required:
      - name
      - type
      - directionality
      - id
      - lineage
      - permalink
