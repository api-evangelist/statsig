openapi: 3.2.0
info:
  title: Console Ingestions API
  description: The "Console API" is the CRUD API for performing the actions offered on console.statsig.com without needing to go through the web UI.
  version: 20240601.0.0
  contact: {}
servers:
- url: https://statsigapi.net
tags:
- name: Ingestions
paths:
  /console/v1/ingestion:
    get:
      summary: Read Ingestion
      parameters:
      - name: type
        required: true
        in: query
        schema:
          type: string
          enum:
          - redshift
          - bigquery-v2
          - snowflake-v2
          - databricks
          - azure-synapse
          - s3
          - athena
          - adls
      - name: dataset
        required: true
        in: query
        schema:
          type: string
          enum:
          - Events
          - Metrics
          - entity_properties
          - export_exposures
          - export_events
      - name: source_name
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Read Ingestion Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/IngestionDto'
                example:
                  message: Ingestion schedule updated successfully.
                  data:
                    dataset: Metrics
                    scheduled_hour_pst: 10
              example:
                message: Ingestion schedule updated successfully.
                data:
                  dataset: Metrics
                  scheduled_hour_pst: 10
      tags:
      - Ingestions
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1Ingestion
      x-operation-id-source: derived
    post:
      summary: Create Ingestion Source
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionSourceCreateContractDto'
      responses:
        '200':
          description: Create Ingestion Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/IngestionDto'
                example:
                  type: databricks
                  dataset: Metrics
                  source_name: ingestion-1
                  query: SELECT * FROM TABLE
                  column_mapping:
                    unit_id: string
                    id_type: string
                    dateid: string
                    metric_name: string
                    metric_value: string
                    numerator: string
                    denominator: string
                  use_delta_sharing: false
                  share: string
                  schema: string
                  table: string
                  enabled: false
              example:
                type: databricks
                dataset: Metrics
                source_name: ingestion-1
                query: SELECT * FROM TABLE
                column_mapping:
                  unit_id: string
                  id_type: string
                  dateid: string
                  metric_name: string
                  metric_value: string
                  numerator: string
                  denominator: string
                use_delta_sharing: false
                share: string
                schema: string
                table: string
                enabled: false
        '400':
          description: Invalid request. Please check the request input and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 400
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Request:
                  value:
                    status: 400
                    message: Ingestion source already exists with name {source_name}
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Ingestion of type {type} not found.
      tags:
      - Ingestions
      security:
      - STATSIG-API-KEY: []
      operationId: postConsoleV1Ingestion
      x-operation-id-source: derived
    patch:
      summary: Update Ingestion Source
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionUpdateContractDto'
      responses:
        '200':
          description: Update Ingestion Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/IngestionDto'
                example:
                  type: databricks
                  dataset: Metrics
                  source_name: ingestion-1
                  query: SELECT * FROM TABLE
                  column_mapping:
                    unit_id: string
                    id_type: string
                    dateid: string
                    metric_name: string
                    metric_value: string
                    numerator: string
                    denominator: string
                  share: string
                  schema: string
                  table: string
                  enabled: false
              example:
                type: databricks
                dataset: Metrics
                source_name: ingestion-1
                query: SELECT * FROM TABLE
                column_mapping:
                  unit_id: string
                  id_type: string
                  dateid: string
                  metric_name: string
                  metric_value: string
                  numerator: string
                  denominator: string
