        required: true
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      - name: end_date
        required: true
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      responses:
        '200':
          description: Get Ingestion Event Count Success
