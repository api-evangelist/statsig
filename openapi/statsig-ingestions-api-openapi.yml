          - azure-synapse
          - s3
          - athena
          - adls
      - name: dataset
        required: true
        in: query
        schema:
          type: string
          enum:
          - Events
          - Metrics
          - entity_properties
          - export_exposures
          - export_events
      - name: source_name
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Delete Ingestion Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/IngestionDto'
                example:
                  message: Ingestion deleted successfully.
              example:
                message: Ingestion deleted successfully.
      tags:
      - Ingestions
      security:
      - STATSIG-API-KEY: []
      operationId: deleteConsoleV1Ingestion
      x-operation-id-source: derived
