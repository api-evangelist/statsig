                    description: helpful summary of what this segment is
                    lastModifierName: CONSOLE API
                    lastModifierID: ahKwUoaNauHu9AmJPc2
                    type: rule_based
                    count: 0
                    rules:
                      name: All Conditions
                      passPercentage: 10
                      conditions:
                      - type: public
                        operator: string
                        targetValue: 0
                        field: string
                        customID: string
                      returnValue:
                        key: true
                    tags:
                    - a tag
              example:
                message: Segments listed successfully.
                data:
                - id: an_id_list
                  isEnabled: true
                  description: helpful summary of what this segment is
                  lastModifierName: CONSOLE API
                  lastModifierID: ahKwUoaNauHu9AmJPc2
