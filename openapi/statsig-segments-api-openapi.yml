      x-operation-id-source: derived
    post:
      summary: Create Segment
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentCreateContractDto'
      responses:
        '201':
          description: Create Segment Success
          content:
