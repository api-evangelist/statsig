                  message: User listed successfully.
                  data:
                  - userID: 5sgBiiuoBX4fscrWdCXVma
                    email: test@statsig.com
                    firstName: a
                    lastName: b
                    role: admin
                  - userID: AeZVbagk2uhvHwmJgnemx
                    email: test@statsig.com
                    firstName: a
                    lastName: b
                    role: member
                  - userID: 1oi5rgdgdUtiXGSi397nxM
                    email: test@statsig.com
                    firstName: test
                    lastName: ''
                    role: admin
                  - userID: 1vaQaBoLlkauH9iiuOSBP2
                    email: test@statsig.com
                    firstName: test
                    lastName: ''
                    role: member
                  - userID: 5sgBiiuoBX4fscrWdCXVma
                    email: test@statsig.com
                    firstName: test
                    lastName: user
                    role: member
                  - userID: AeZVbagk2uhvHwmJgnemx
                    email: test@statsig.com
                    firstName: test
                    lastName: user
                    role: admin
                  - userID: 1oi5rgdgdUtiXGSi397nxM
                    email: test@statsig.com
                    firstName: test
                    lastName: user
                    role: admin
                  - userID: 1vaQaBoLlkauH9iiuOSBP2
                    email: test@statsig.com
                    firstName: test
                    lastName: user
                    role: member
                  pagination:
                    itemsPerPage: 10
                    pageNumber: 4
                    totalItems: 38
                    nextPage: null
                    previousPage: /console/v1/users?page=3&limit=10
                    all: /console/v1/users
              example:
                message: User listed successfully.
                data:
                - userID: 5sgBiiuoBX4fscrWdCXVma
                  email: test@statsig.com
                  firstName: a
                  lastName: b
                  role: admin
                - userID: AeZVbagk2uhvHwmJgnemx
                  email: test@statsig.com
                  firstName: a
                  lastName: b
                  role: member
                - userID: 1oi5rgdgdUtiXGSi397nxM
                  email: test@statsig.com
                  firstName: test
                  lastName: ''
                  role: admin
                - userID: 1vaQaBoLlkauH9iiuOSBP2
                  email: test@statsig.com
                  firstName: test
                  lastName: ''
                  role: member
                - userID: 5sgBiiuoBX4fscrWdCXVma
                  email: test@statsig.com
                  firstName: test
                  lastName: user
                  role: member
                - userID: AeZVbagk2uhvHwmJgnemx
                  email: test@statsig.com
                  firstName: test
                  lastName: user
                  role: admin
                - userID: 1oi5rgdgdUtiXGSi397nxM
                  email: test@statsig.com
                  firstName: test
                  lastName: user
                  role: admin
                - userID: 1vaQaBoLlkauH9iiuOSBP2
                  email: test@statsig.com
                  firstName: test
                  lastName: user
                  role: member
