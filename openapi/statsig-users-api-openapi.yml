openapi: 3.2.0
info:
  title: Statsig Users API
  version: '1.0'
  description: 'Operations tagged Users across 2 of this provider''s published API definitions: statsig-console-api-openapi.yml, statsig-users-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://statsigapi.net/console/v1
  description: Statsig Console API Server
- url: https://statsigapi.net
tags:
- name: Users
  description: Manage user data and lookup user properties within the Statsig project.
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      description: Retrieves a list of users known to the Statsig project.
      tags:
      - Users
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /console/v1/users:
    servers:
    - url: https://statsigapi.net
    get:
      summary: List Users
      parameters:
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: include_stale_members
        required: false
        in: query
        description: Whether to include stale company-user membership edges. Defaults to false, which returns only effective current members (matching the Settings UI).
        schema:
          example: false
          type: boolean
      responses:
        '200':
          description: List users response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserContractDto'
