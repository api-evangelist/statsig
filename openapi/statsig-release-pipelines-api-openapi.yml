components:
  schemas:
    ReleasePipelineDto:
      type: object
      properties:
        id:
          type: string
          description: Pipeline ID
        name:
          type: string
          description: Pipeline Name
        creatorID:
          type: string
          description: Pipeline Creator ID
        createdTime:
          type: number
          description: Pipeline Creation Time
          format: double
        lastModifierID:
          type: string
          description: Last Modifier ID
        lastModifiedTime:
          type: number
          description: Last Modification Time
          format: double
        phases:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Phase ID
              name:
                type: string
                description: Phase Name
              timeIntervalMs:
                type: number
                description: Time interval in milliseconds for this phase
              requiredReview:
                type: boolean
                description: Whether this phase requires review to proceed
              rules:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The Statsig ID of this rule.
                    name:
                      type: string
                      description: The name of this rule.
                    conditions:
                      type: array
                      items:
                        type: object
                        properties:
                          targetValue:
                            oneOf:
                            - type: array
                              items:
                                type: string
                            - type: array
                              items:
                                type: number
                            - type: string
                            - type: number
                          operator:
                            type: string
                            enum:
                            - any
                            - none
                            - any_case_sensitive
                            - none_case_sensitive
                            - str_contains_any
                            - str_contains_none
                            - gt
                            - lt
                            - lte
                            - gte
                            - version_gt
                            - version_lt
                            - version_gte
                            - version_lte
                            - version_eq
                            - after
                            - before
                            - 'on'
                            - is_null
                            - is_not_null
                            - str_matches
                            - encoded_any
                            - array_contains_any
                            - array_contains_none
                            - array_contains_all
                            - not_array_contains_all
                          field:
                            type:
                            - string
                            - 'null'
                          customID:
                            type:
                            - string
                            - 'null'
                          type:
                            type: string
