openapi: 3.2.0
info:
  title: Console Release Pipelines API
  description: The "Console API" is the CRUD API for performing the actions offered on console.statsig.com without needing to go through the web UI.
  version: 20240601.0.0
  contact: {}
servers:
- url: https://statsigapi.net
tags:
- name: Release Pipelines
paths:
  /console/v1/release_pipeline_triggers:
    get:
      summary: List Pipeline Triggers
      parameters:
      - name: releasePipelineID
        required: false
        in: query
        description: Filter by Release Pipeline ID
        schema:
          type: string
      - name: gateID
        required: false
        in: query
        description: Filter by Gate ID
        schema:
          type: string
      - name: dynamicConfigID
        required: false
        in: query
        description: Filter by Dynamic Config ID
        schema:
          type: string
      - name: status
        required: false
        in: query
        description: Filter by Status
        schema:
          oneOf:
          - oneOf:
            - type: string
              enum:
              - IN_PROGRESS
              - PAUSED
              - ABORTED
              - COMPLETED
            - type: string
              enum:
              - WAITING_FOR_REVIEW
          - type: array
            items:
              oneOf:
              - type: string
                enum:
                - IN_PROGRESS
                - PAUSED
                - ABORTED
                - COMPLETED
              - type: string
                enum:
                - WAITING_FOR_REVIEW
      - name: startDate
        required: false
        in: query
        description: Filter by the start date of the date range of the trigger's creation date in UTC, inclusive
        schema:
          example: '2024-01-01'
          type: string
      - name: endDate
        required: false
        in: query
        description: Filter by the end date of the date range of the trigger's creation date in UTC, inclusive (i.e. until the end of the day); defaults to today's date if not provided
        schema:
          example: '2024-01-01'
          type: string
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      responses:
        '200':
          description: List pipeline triggers success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReleasePipelineTriggerResponseDto'
                example:
                  data:
                  - id: trigger_1646560789123
                    releasePipelineID: pipeline_123456
                    status: IN_PROGRESS
                    currentPhase: Phase 1
                    currentPhaseID: phase_123456
                    currentPhaseEndTime: 1646560799123
                    actions:
                    - type: STARTED
                      timeMs: 1646560789123
                      phaseID: phase_123456
                      actorID: user_123456
                      actorName: John Doe
                    creatorID: user_123456
                    createdTime: 1646560789123
                    lastModifierID: user_123456
                    lastModifierName: John Doe
                    gateID: gate_123456
                  - id: trigger_1646560789124
                    releasePipelineID: pipeline_123456
                    status: COMPLETED
                    currentPhase: Phase 1
                    currentPhaseID: phase_123456
                    currentPhaseEndTime: 1646560799124
                    actions:
                    - type: STARTED
                      timeMs: 1646560789123
                      phaseID: phase_123456
                      actorID: user_123456
                      actorName: John Doe
                    creatorID: user_123456
                    createdTime: 1646560789124
                    lastModifierID: user_654321
                    lastModifierName: Jane Doe
                    dynamicConfigID: dynamic_config_123456
                  pagination:
                    itemsPerPage: 10
                    pageNumber: 1
                    nextPage: null
                    previousPage: null
                    totalItems: 2
                  message: Pipeline triggers listed correctly.
              example:
                data:
                - id: trigger_1646560789123
                  releasePipelineID: pipeline_123456
                  status: IN_PROGRESS
                  currentPhase: Phase 1
                  currentPhaseID: phase_123456
                  currentPhaseEndTime: 1646560799123
                  actions:
                  - type: STARTED
                    timeMs: 1646560789123
                    phaseID: phase_123456
                    actorID: user_123456
                    actorName: John Doe
                  creatorID: user_123456
                  createdTime: 1646560789123
                  lastModifierID: user_123456
                  lastModifierName: John Doe
                  gateID: gate_123456
                - id: trigger_1646560789124
                  releasePipelineID: pipeline_123456
                  status: COMPLETED
                  currentPhase: Phase 1
                  currentPhaseID: phase_123456
                  currentPhaseEndTime: 1646560799124
                  actions:
                  - type: STARTED
                    timeMs: 1646560789123
                    phaseID: phase_123456
                    actorID: user_123456
                    actorName: John Doe
                  creatorID: user_123456
                  createdTime: 1646560789124
                  lastModifierID: user_654321
                  lastModifierName: Jane Doe
                  dynamicConfigID: dynamic_config_123456
                pagination:
