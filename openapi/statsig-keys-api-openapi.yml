components:
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error message describing the authentication failure.
  schemas:
    ApiKey:
      type: object
      description: An API key for accessing Statsig services.
      properties:
        key:
          type: string
          description: The API key value (partially masked).
        type:
          type: string
          enum:
          - server
          - client
          - console
          description: The type of API key.
        description:
          type: string
          description: A description of the key purpose.
        createdTime:
          type: integer
          format: int64
          description: Timestamp when the key was created.
    KeyDto:
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        type:
          type: string
          enum:
          - SERVER
          - CLIENT
          - CONSOLE
          - SCIM
          - ORG
        description:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - omni_read_only
            - omni_read_write
            - client_download_config_specs
            - none_hash_enabled
            - can_access_keys
            - client_can_write_user_store
            - personal_read_only
            - personal_read_write
        environments:
          type: array
          items:
            type: string
        primaryTargetApp:
          type:
          - string
          - 'null'
        secondaryTargetApps:
          type:
          - array
          - 'null'
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - deactivated
        lastUsed:
          type:
          - string
          - 'null'
      required:
      - key
      - type
      - description
      - scopes
      - status
    SingleDataResponse:
      type: object
      properties:
        message:
          type: string
          description: A simple string explaining the result of the operation.
        data:
          type: object
          description: A single result.
      required:
      - message
      - data
    PaginationResponseWithMessage:
      type: object
      properties:
        message:
          type: string
          description: A simple string explaining the result of the operation.
        data:
          description: Array of results returned by pagination limit.
          type: array
          items:
            type: object
        pagination:
          description: Pagination metadata for checking if there is next page for example.
          allOf:
          - $ref: '#/components/schemas/PaginationResponseMetadataDto'
      required:
      - message
      - data
      - pagination
    KeyCreateContractDto:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
        type:
          type: string
          enum:
          - SERVER
          - CLIENT
          - CONSOLE
          - SCIM
          - ORG
        scopes:
          type: array
          items:
            type: string
            enum:
            - omni_read_only
            - omni_read_write
            - client_download_config_specs
            - none_hash_enabled
            - can_access_keys
            - client_can_write_user_store
            - personal_read_only
            - personal_read_write
        environments:
          type: array
          items:
            type: string
        targetAppID:
          type: string
        secondaryTargetAppIDs:
          type: array
          items:
            type: string
      required:
      - description
      - type
    KeyUpdateContractDto:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
        scopes:
          type: array
          items:
            type: string
            enum:
            - omni_read_only
            - omni_read_write
            - client_download_config_specs
            - none_hash_enabled
            - can_access_keys
            - client_can_write_user_store
            - personal_read_only
            - personal_read_write
        environments:
          type: array
          items:
            type: string
        targetAppID:
          type:
          - string
          - 'null'
        secondaryTargetAppIDs:
          type:
          - array
          - 'null'
          items:
            type: string
    PaginationResponseMetadataDto:
      type: object
      properties:
        itemsPerPage:
          type: number
          format: double
        pageNumber:
          type: number
          format: double
        nextPage:
          type:
          - string
          - 'null'
        previousPage:
          type:
          - string
          - 'null'
        totalItems:
          type: number
          format: double
        all:
          type: string
      required:
      - itemsPerPage
      - pageNumber
      - nextPage
      - previousPage
  parameters:
    ApiVersion:
      name: STATSIG-API-VERSION
      in: header
      required: false
      schema:
        type: string
        default: '20240601'
      description: The Console API version. Currently the only version is 20240601.
  securitySchemes:
    consoleApiKey:
      type: apiKey
      in: header
      name: STATSIG-API-KEY
      description: Console API Key created in Project Settings > API Keys tab. Required for all Console API requests.
    STATSIG-API-KEY:
      type: apiKey
      name: STATSIG-API-KEY
      in: header
externalDocs:
  description: Statsig Console API Documentation
  url: https://docs.statsig.com/console-api/
