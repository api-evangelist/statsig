openapi: 3.2.0
info:
  title: Statsig Keys API
  version: '1.0'
  description: 'Operations tagged Keys across 2 of this provider''s published API definitions: statsig-console-api-openapi.yml, statsig-console-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://statsigapi.net/console/v1
  description: Statsig Console API Server
- url: https://statsigapi.net
tags:
- name: Keys
  description: Manage API keys for the project including server secret keys, client SDK keys, and console API keys.
paths:
  /keys:
    get:
      operationId: listKeys
      summary: List all API keys
      description: Retrieves a list of all API keys in the project including server secret keys, client SDK keys, and console API keys.
      tags:
      - Keys
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /console/v1/keys:
    get:
      summary: List Keys
      parameters:
      - name: primaryTargetApp
        required: false
        in: query
        schema:
          type: string
      - name: environment
        required: false
        in: query
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      responses:
        '200':
          description: Keys listed successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginationResponseWithMessage'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/KeyDto'
                example:
                  message: Keys listed successfully.
                  data:
                  - key: secret-123
                    type: SERVER
                    description: Server secret key
                    scopes: []
                    environments:
                    - production
                    primaryTargetApp: primaryApp
                    secondaryTargetApps:
                    - secondaryApp
                    status: active
                  - key: console-123
                    type: CONSOLE
                    description: Console API key
                    scopes:
                    - omni_read_write
                    - can_access_keys
                    status: active
              example:
                message: Keys listed successfully.
                data:
                - key: secret-123
                  type: SERVER
                  description: Server secret key
                  scopes: []
                  environments:
                  - production
                  primaryTargetApp: primaryApp
                  secondaryTargetApps:
                  - secondaryApp
                  status: active
                - key: console-123
                  type: CONSOLE
                  description: Console API key
                  scopes:
                  - omni_read_write
                  - can_access_keys
                  status: active
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 403
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Forbidden resource:
                  value:
                    status: 403
                    message: Forbidden. The request was valid, but the server is refusing action. You might not have the necessary permissions to access the resource.
      tags:
      - Keys
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1Keys
      x-operation-id-source: derived
    post:
      summary: Create Key
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyCreateContractDto'
      responses:
        '200':
          description: Key created successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/KeyDto'
                example:
                  message: Key created successfully.
                  data:
                    key: secret-123
                    type: SERVER
                    description: Server secret key
                    scopes: []
                    environments:
                    - production
                    primaryTargetApp: primaryApp
                    secondaryTargetApps:
                    - secondaryApp
                    status: active
              example:
                message: Key created successfully.
                data:
                  key: secret-123
                  type: SERVER
                  description: Server secret key
                  scopes: []
                  environments:
                  - production
                  primaryTargetApp: primaryApp
                  secondaryTargetApps:
                  - secondaryApp
                  status: active
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 403
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Forbidden resource:
                  value:
                    status: 403
                    message: Forbidden. The request was valid, but the server is refusing action. You might not have the necessary permissions to access the resource.
      tags:
      - Keys
      security:
      - STATSIG-API-KEY: []
      operationId: postConsoleV1Keys
      x-operation-id-source: derived
    servers:
    - url: https://statsigapi.net
