                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Keys
      security:
      - STATSIG-API-KEY: []
      operationId: getConsoleV1KeysById
      x-operation-id-source: derived
    patch:
      summary: Update Key
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyUpdateContractDto'
      responses:
        '200':
          description: Key updated successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/KeyDto'
                example:
                  message: Key updated successfully.
                  data:
                    environments:
                    - staging
                    targetAppID: primaryApp
                    secondaryTargetAppIDs: null
              example:
                message: Key updated successfully.
                data:
                  environments:
                  - staging
                  targetAppID: primaryApp
                  secondaryTargetAppIDs: null
        '403':
          description: Insufficient permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 403
                  message:
                    type: string
                required:
