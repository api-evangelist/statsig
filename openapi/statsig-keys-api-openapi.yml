              examples:
                Forbidden resource:
                  value:
                    status: 403
                    message: Forbidden. The request was valid, but the server is refusing action. You might not have the necessary permissions to access the resource.
        '404':
          description: Key not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 404
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Not Found:
                  value:
                    status: 404
                    message: Not Found. The requested resource could not be found.
      tags:
      - Keys
      security:
      - STATSIG-API-KEY: []
      operationId: patchConsoleV1KeysById
      x-operation-id-source: derived
    delete:
      summary: Delete Key
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Key deleted successfully
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                example:
                  message: Key deleted successfully.
                  data:
                    key: secret-123
                    type: SERVER
                    description: Server secret key
                    scopes: []
                    environments:
                    - production
                    primaryTargetApp: primaryApp
                    secondaryTargetApps:
                    - secondaryApp
                    status: active
              example:
                message: Key deleted successfully.
                data:
                  key: secret-123
                  type: SERVER
                  description: Server secret key
                  scopes: []
                  environments:
                  - production
                  primaryTargetApp: primaryApp
