openapi: 3.2.0
info:
  title: Statsig Experiments API
  version: '1.0'
  description: 'Operations tagged Experiments across 3 of this provider''s published API definitions: statsig-console-api-openapi.yml, statsig-http-api-openapi.yml, statsig-experiments-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://statsigapi.net/console/v1
  description: Statsig Console API Server
- url: https://api.statsig.com/v1
  description: Statsig API Server
- url: https://statsigapi.net
tags:
- name: Experiments
  description: Manage A/B test experiments including creation, configuration, starting, resetting, and analysis.
paths:
  /experiments:
    get:
      operationId: listExperiments
      summary: List all experiments
      description: Retrieves a list of all experiments in the project with their current status and configuration.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of experiments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experiment'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    post:
      operationId: createExperiment
      summary: Create an experiment
      description: Creates a new experiment in the project with the specified hypothesis, groups, and parameter configuration.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreate'
      responses:
        '201':
          description: Experiment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /experiments/{id}:
    get:
      operationId: getExperiment
      summary: Get an experiment
      description: Retrieves the full configuration of a specific experiment including its groups, parameters, hypothesis, and status.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - consoleApiKey: []
    patch:
      operationId: partiallyUpdateExperiment
      summary: Partially update an experiment
      description: Updates specific fields of an experiment without replacing the entire configuration.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentUpdate'
      responses:
        '200':
          description: Experiment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - consoleApiKey: []
    delete:
      operationId: deleteExperiment
      summary: Delete an experiment
      description: Permanently deletes an experiment from the project.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /experiments/{id}/start:
    put:
      operationId: startExperiment
      summary: Start an experiment
      description: Starts an experiment, beginning to allocate users to experiment groups and logging exposures.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /experiments/{id}/reset:
    put:
      operationId: resetExperiment
      summary: Reset an experiment
      description: Resets an experiment, clearing all collected data and resetting user assignments.
      tags:
      - Experiments
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Experiment reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - consoleApiKey: []
    servers:
    - url: https://statsigapi.net/console/v1
      description: Statsig Console API Server
  /get_experiment:
    post:
      operationId: postGetExperiment
      summary: Get an experiment configuration
      description: Fetches the experiment configuration and group assignment for the specified user. This is functionally similar to get_config but specifically targets experiments. An exposure event is automatically logged for experiment analysis.
      tags:
      - Experiments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user
              - experimentName
              properties:
                user:
                  $ref: '#/components/schemas/StatsigUser'
                experimentName:
                  type: string
                  description: The name of the experiment to retrieve.
      responses:
        '200':
          description: Experiment configuration and group assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the experiment.
                  value:
                    type: object
                    description: The JSON object containing the experiment parameter values for this user.
                  group:
                    type: string
                    description: The experiment group the user was assigned to.
                  rule_id:
                    type: string
                    description: The identifier of the rule that was matched.
                  group_name:
                    type: string
                    description: The name of the group the user was assigned to.
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - statsigApiKey: []
      x-operation-id-source: normalized
      x-operation-id-original: getExperiment
    servers:
    - url: https://api.statsig.com/v1
      description: Statsig API Server
  /console/v1/experiments:
    servers:
    - url: https://statsigapi.net
    get:
      summary: List Experiments
      parameters:
      - name: layerID
        required: false
        in: query
        description: Which layer to place the experiment into.
        schema:
          type: string
      - name: idType
        required: false
        in: query
        description: The idType the experiment will be performed on
        schema:
          type: string
      - name: teamID
        required: false
        in: query
        description: The team ID associated with the experiment, Enterprise only.
        schema:
          type:
          - string
          - 'null'
      - name: status
        required: false
        in: query
        description: The current status of the experiment
        schema:
          oneOf:
          - type: string
            enum:
            - active
            - setup
            - decision_made
            - abandoned
            - archived
            - experiment_stopped
            - assignment_stopped
          - type: array
            items:
              type: string
              enum:
              - active
              - setup
              - decision_made
              - abandoned
              - archived
              - experiment_stopped
              - assignment_stopped
      - name: targetAppID
        required: false
        in: query
        schema:
          type: string
      - name: stale
        required: false
        in: query
        description: When true, only returns stale experiments. If omitted or false, returns all experiments.
        schema:
          type: boolean
      - name: createdStartDate
        required: false
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      - name: createdEndDate
        required: false
        in: query
        description: Expected valid date in the form of YYYY-MM-DD
        schema:
          example: '2024-01-01'
          type: string
      - name: experimentType
        required: false
        in: query
        description: Filter by experiment type
        schema:
          oneOf:
          - type: string
            enum:
            - BASE
            - GEO
            - SWITCHBACK
            - PROMPT
            - SIDECAR
            - GRID_SEARCH
          - type: array
            items:
              type: string
              enum:
              - BASE
              - GEO
              - SWITCHBACK
              - PROMPT
              - SIDECAR
              - GRID_SEARCH
      - name: ids
        required: false
        in: query
        description: Fetch a specific set of experiments by ID in a single request (comma-separated, max 100). Only experiments matching these IDs are returned; unknown IDs are omitted. For more than 100, split into batches of 100. Combine with `fields` to fetch trimmed details for several experiments at once.
        examples:
          single id:
            value: experiment_a
          multiple ids:
            value: experiment_a,experiment_b
        schema:
          maxItems: 100
          type: array
          items:
            type: string
      - name: fields
        required: false
        in: query
        description: Comma-separated list of top-level fields to return (sparse fieldset), e.g. `id,name,hypothesis,groups`. `id` is always included. Reduces response size; when omitted the full experiment is returned.
        examples:
          single field:
            value: hypothesis
          multiple fields:
            value: id,name,hypothesis,groups
        schema:
          type: array
          items:
            type: string
      - name: creatorName
        required: false
        in: query
        description: Name of the creator.
        schema:
          type:
          - string
          - 'null'
      - name: creatorID
        required: false
        in: query
        description: ID of the user who created the entity.
        schema:
          type:
          - string
          - 'null'
      - name: tags
        required: false
        in: query
        description: Filter by tags
        examples:
          single tag:
            value: tag1
          multiple tags:
            value:
            - tag1
            - tag2
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - name: limit
        required: false
        in: query
        description: Results per page
        schema:
          example: 10
          oneOf:
          - type: string
          - type: number
          type: integer
      - name: page
        required: false
        in: query
        description: Page number
        schema:
          example: 1
          oneOf:
          - type: string
          - type: number
          type: integer
      responses:
        '200':
          description: List Experiments Success
          content:
            application/json:
              schema:
