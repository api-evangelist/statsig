          type: boolean
          description: Warehouse Native only - whether to run scheduled reloads with Turbo mode.
        autoLoadToplineImpact:
          type: boolean
          description: Warehouse Native only - whether to automatically run topline and projected launch impact calculations when reloading experiments.
        analysisEndTime:
          type: string
          description: Warehouse Native only - end time for analysis only experiments
        assignmentSourceFilters:
          type: array
          items:
            type: object
            properties:
              column:
                type: string
                description: Column to filter on.
              condition:
                type: string
                enum:
                - in
                - not_in
                - '='
                - '>'
                - <
                - '>='
                - <=
                - is_null
                - non_null
                - contains
                - not_contains
                - sql_filter
                - starts_with
                - ends_with
                - after_exposure
                - before_exposure
                - is_true
                - is_false
              values:
                type: array
                items:
                  type: string
                description: Optional array of values for the criterion to match against.
            required:
            - condition
          description: Array of criteria for filtering assignment sources.
