    ExperimentPulseResultsDto:
      type: object
      properties:
        ds:
          type: string
        primaryMetrics:
          type: array
          items:
            type: object
            properties:
              metricID:
                type: string
              metricName:
                type: string
              directionality:
                type: string
                enum:
                - increase
                - decrease
                description: Indicates the desired change direction for the metric. Use "increase" for positive changes and "decrease" for negative changes.
                example: increase
              error:
                oneOf:
                - type: string
                  enum:
                  - no_data
                  - import_no_data
                  - incompatible_types
                  - echidna_unripe
                  - setup_incomplete
                  - hourly_metric_type_not_supported
                  - control_or_test_no_units
                  - no_subdimension_filter
                - type: string
                description: Machine-readable reason when pulse statistics are unavailable. Common values include no_data (insufficient data), echidna_unripe (not yet loaded), and setup_incomplete (misconfigured metric source). Additional string values may appear for cohort/bake windows or other load failures.
                example: no_data
              warnings:
                type: array
                items:
                  type: string
                description: Human-readable warnings about metric data quality, load state, or partial pipeline failures.
              absoluteChange:
                type: number
              confidenceIntervalDelta:
                type: number
                description: Absolute confidence interval delta
              confidenceInterval:
                type: object
                properties:
                  lower:
                    type: number
                  upper:
                    type: number
                required:
                - lower
                - upper
                additionalProperties: false
                description: Confidence interval bounds
                example:
                  lower: -1.33
                  upper: 1.33
              percentChange:
                type: number
              sequentialTestingConfidenceIntervalDelta:
                type: number
              sequentialTestingConfidenceInterval:
                type: object
                properties:
                  lower:
                    type: number
                  upper:
                    type: number
                required:
                - lower
                - upper
                additionalProperties: false
                description: Confidence interval bounds
                example:
                  lower: -1.33
                  upper: 1.33
              percentConfidenceIntervalDelta:
                type: number
              percentConfidenceInterval:
                type: object
                properties:
                  lower:
                    type: number
                  upper:
                    type: number
                required:
                - lower
                - upper
                additionalProperties: false
                description: Confidence interval bounds
                example:
                  lower: -1.33
                  upper: 1.33
              percentSequentialTestingConfidenceIntervalDelta:
                type: number
              percentSequentialTestingConfidenceInterval:
                type: object
                properties:
                  lower:
                    type: number
                  upper:
                    type: number
                required:
                - lower
                - upper
                additionalProperties: false
                description: Confidence interval bounds
                example:
                  lower: -1.33
                  upper: 1.33
              testMean:
                type: number
              controlMean:
                type: number
              testStd:
                type: number
              controlStd:
                type: number
              testUnits:
                type: number
              controlUnits:
                type: number
              pValue:
                type: number
              sequentialTestingPValue:
                type:
                - number
                - 'null'
              adjustedAlpha:
                type: number
              reversePower:
                type: number
              percentCredibleInterval:
                type: object
                properties:
                  lower:
                    type: number
                  upper:
                    type: number
                required:
                - lower
                - upper
                additionalProperties: false
                description: Bayesian credible interval for the percent change. Only returned when results are computed with Bayesian analysis.
                example:
                  lower: -1.33
                  upper: 1.33
              expectedLoss:
                type: number
                description: Bayesian expected loss. Only returned when results are computed with Bayesian analysis.
              chanceToBeat:
                type: number
                description: Bayesian probability that the test beats the control. Only returned when results are computed with Bayesian analysis.
              sequentialTestingLikelihoodRatio:
                type: number
                description: SPRT likelihood ratio of the observed data under the alternative vs the null. This is the same value Pulse uses.
              sequentialTestingLogLikelihoodRatio:
                type: number
                description: Natural log of the SPRT likelihood ratio Pulse uses. Compare this to `sprtLogLowerLimit` and `sprtLogUpperLimit`.
              sprtLowerLimit:
                type: number
                description: Lower SPRT decision boundary on the likelihood-ratio scale. Crossing below this accepts the null.
              sprtUpperLimit:
                type: number
                description: Upper SPRT decision boundary on the likelihood-ratio scale. Crossing above this accepts the alternative.
              sprtLogLowerLimit:
                type: number
                description: Lower SPRT decision boundary on the log-likelihood-ratio scale. Crossing below this accepts the null.
              sprtLogUpperLimit:
                type: number
                description: Upper SPRT decision boundary on the log-likelihood-ratio scale. Crossing above this accepts the alternative.
              sprtDecision:
                type: string
                enum:
