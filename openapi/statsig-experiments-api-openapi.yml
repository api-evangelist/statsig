                      type: number
                    mean:
                      type: number
                    stdDev:
                      type: number
                  required:
                  - groupKey
                  - mde
            required:
            - metricKey
            - groupSettings
          description: The SPRT values for use in the experiment.
        isSidecar:
          type: boolean
          description: Whether this is a Statsig Sidecar experiment. `sidecarEditorURL`, `sidecarURLFilters`, `sidecarDisableAutoRun`, and `sidecarPrerunScript` are saved only when this is `true`.
        sidecarEditorURL:
          type: string
          description: 'Sidecar (Visual Editor) only: the URL of the page being modified. The Visual Editor cannot open without it, and it must be an `http` or `https` URL.'
        sidecarURLFilters:
          type: array
          items:
            type: object
            properties:
              type:
