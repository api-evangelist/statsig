components:
  schemas:
    ExperimentUpdate:
      type: object
      description: Request body for partially updating an experiment.
      properties:
        description:
          type: string
          description: Updated description.
        hypothesis:
          type: string
          description: Updated hypothesis.
        allocation:
          type: number
          minimum: 0
          maximum: 100
          description: Updated allocation percentage.
        tags:
          type: array
          items:
            type: string
          description: Updated tags.
    ExperimentGroup:
      type: object
      description: An experiment group defining parameter values for a set of users.
      properties:
        name:
          type: string
          description: The name of the group (e.g., control, test).
        size:
          type: number
          minimum: 0
          maximum: 100
          description: The percentage of allocated users assigned to this group.
        parameterValues:
          type: object
          description: The parameter key-value pairs for this group.
    Experiment:
      type: object
      description: An A/B test experiment with defined groups, parameters, and analysis configuration.
      properties:
        id:
          type: string
          description: The unique identifier of the experiment.
        name:
          type: string
          description: The name of the experiment.
        description:
          type: string
          description: A human-readable description of the experiment.
        hypothesis:
          type: string
          description: The hypothesis being tested by this experiment.
        status:
          type: string
          enum:
          - setup
          - active
          - decision_made
          - abandoned
          description: The current status of the experiment.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentGroup'
          description: The experiment groups and their parameter configurations.
        allocation:
          type: number
          minimum: 0
          maximum: 100
          description: The percentage of eligible users allocated to the experiment.
        layerID:
          type: string
          description: The layer this experiment belongs to, if any.
        targetingGateID:
          type: string
          description: The gate used to filter eligible users for the experiment.
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the experiment.
        createdTime:
          type: integer
          format: int64
          description: Timestamp when the experiment was created.
        lastModifiedTime:
          type: integer
          format: int64
          description: Timestamp when the experiment was last modified.
    ExperimentCreate:
      type: object
      description: Request body for creating a new experiment.
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the experiment to create.
        description:
          type: string
          description: A human-readable description.
        hypothesis:
          type: string
          description: The hypothesis being tested.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentGroup'
          description: The experiment groups.
        allocation:
          type: number
          minimum: 0
          maximum: 100
          description: The percentage of eligible users.
        layerID:
          type: string
          description: The layer to assign this experiment to.
        targetingGateID:
          type: string
          description: The gate used to filter eligible users.
        tags:
          type: array
          items:
            type: string
          description: Tags to associate with the experiment.
    Pagination:
      type: object
      description: Pagination metadata for list responses.
      properties:
        total:
          type: integer
          description: Total number of items available.
        page:
          type: integer
          description: Current page number.
        limit:
          type: integer
          description: Number of items per page.
        hasMore:
          type: boolean
          description: Whether more pages are available.
    StatsigUser:
      type: object
      description: The user object representing the end user being evaluated. At minimum, a userID should be provided. Additional properties enable more sophisticated targeting.
      properties:
        userID:
          type: string
          description: A unique identifier for the user.
        email:
          type: string
          format: email
          description: The email address of the user, used for email-based targeting.
        ip:
          type: string
          description: The IP address of the user, used for IP-based targeting.
        userAgent:
          type: string
          description: The user agent string, used for browser or device targeting.
        country:
          type: string
          description: The two-letter country code of the user.
        locale:
          type: string
          description: The locale identifier for the user.
        appVersion:
          type: string
          description: The version of the application the user is using.
        custom:
          type: object
          additionalProperties: true
          description: Custom properties for the user, used for custom targeting rules.
        privateAttributes:
          type: object
          additionalProperties: true
          description: Private user attributes used for evaluation but stripped before logging to Statsig servers.
        customIDs:
          type: object
          additionalProperties:
            type: string
          description: Custom identifier mappings for the user, such as companyID or teamID.
    PaginationResponseWithMessage:
      type: object
      properties:
        message:
          type: string
          description: A simple string explaining the result of the operation.
        data:
          description: Array of results returned by pagination limit.
          type: array
          items:
            type: object
        pagination:
          description: Pagination metadata for checking if there is next page for example.
          allOf:
          - $ref: '#/components/schemas/PaginationResponseMetadataDto'
      required:
      - message
      - data
      - pagination
    ExperimentFullUpdateDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 3
          pattern: ^[a-zA-Z0-9_\- ]*$
          description: The display name of the experiment
        description:
          type: string
          maxLength: 1000
          description: A helpful summary of what this experiment does
        idType:
          type: string
          description: The type of ID which the experiment is based on
        secondaryIDType:
          type:
          - string
          - 'null'
          description: The secondary ID type for the experiment used in WHN for ID resolution
        identifierMappingMode:
          type: string
          enum:
          - strictOneToOne
          - firstTouchOneToMany
          - lastTouchOneToMany
          description: The identifier mapping mode for the experiment used in WHN for ID resolution
        identityResolutionSource:
          type:
          - string
          - 'null'
          description: The identity resolution entity property source for the experiment used in WHN for ID resolution
        hypothesis:
          type: string
          description: A statement that will be tested by this experiment
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: The URL of the link
              title:
                type: string
                description: The title of the link
            required:
            - url
          description: Links to relevant documentation or resources
        externalEvents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              timestamp:
                type: number
            required:
            - name
            - timestamp
        groups:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              id:
                type:
                - string
                - 'null'
              size:
                type: number
                minimum: 0
                maximum: 100
              parameterValues:
                type: object
                additionalProperties: {}
                description: A map of parameter name to the value this group serves. Sidecar (Visual Editor) experiments also return `sidecarURLFilters`, `sidecarDisableAutoRun`, `sidecarPrerunScript`, and `sidecarExperimentName` here, copied from the experiment itself on read. Sending them here does nothing; set them as experiment fields instead.
              disabled:
                type: boolean
              description:
                type: string
              foreignGroupID:
                type: string
              highlighted:
                type: boolean
                description: Marks this experiment group as highlighted in analysis views. Highlighted groups are prioritized (shown first) and can be used to filter.
            required:
            - name
            - size
            - parameterValues
          description: The test groups for your experiment
        controlGroupID:
          type: string
          description: Optional control group ID
        allocation:
          type: number
          minimum: 0
          maximum: 100
          description: Percent of layer allocated to this experiment
          format: double
        userBuckets:
          type: array
          items:
            type: number
            minimum: 0
            exclusiveMaximum: 1000
        primaryMetricTags:
          type: array
          items:
            type: string
          description: Primary metric tags for the experiment
        secondaryMetricTags:
          type: array
          items:
            type: string
          description: Secondary metric tags for the experiment
        primaryMetrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The metric name.
              type:
                type: string
                description: The metric type.
              direction:
                type: string
                enum:
                - increase
                - decrease
                description: The expected direction for one-sided testing (a feature to only measure metric movements in a single direction)
              hypothesizedValue:
                type: number
                description: The comparison value for the one-sample testing (a feature to use a fixed baseline as the control value)
            required:
            - name
            - type
          description: Main metrics needed to evaluate your hypothesis
        secondaryMetrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The metric name.
              type:
                type: string
                description: The metric type.
              direction:
                type: string
                enum:
                - increase
                - decrease
                description: The expected direction for one-sided testing (a feature to only measure metric movements in a single direction)
              hypothesizedValue:
                type: number
                description: The comparison value for the one-sample testing (a feature to use a fixed baseline as the control value)
            required:
            - name
            - type
          description: Additional metrics to monitor that might impact the analysis or final decision of the experiment
        otherMetrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The metric name.
              type:
                type: string
                description: The metric type.
              direction:
                type: string
                enum:
                - increase
                - decrease
                description: The expected direction for one-sided testing (a feature to only measure metric movements in a single direction)
              hypothesizedValue:
                type: number
                description: The comparison value for the one-sample testing (a feature to use a fixed baseline as the control value)
            required:
            - name
            - type
          description: Additional metrics you want to investigate or learn from. The usual corrections applied to Primary and Secondary metrics are not applied to these.
        targetApps:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: Target apps assigned to this experiment
        tags:
          type: array
          items:
            type: string
          description: Tags associated with the experiment
        duration:
          type: integer
          description: How long the experiment is expected to last in days
          format: int64
          exclusiveMinimum: 1
        targetExposures:
          type: integer
          description: Target exposures for the experiment
          format: int64
          exclusiveMinimum: 1
        targetingGateID:
          type:
          - string
          - 'null'
          description: Restrict your experiment to users passing the selected feature gate
        sequentialTesting:
          type: boolean
          description: Apply sequential testing?
        bonferroniCorrection:
          type: boolean
          description: Is Bonferroni correction applied per variant?
        bonferroniCorrectionPerMetric:
          type: boolean
          description: Is Bonferroni correction applied per metric?
        benjaminiHochbergPerVariant:
          type: boolean
          description: Is Benjamini-Hochberg procedure applied per variant?
        benjaminiHochbergPerMetric:
          type: boolean
          description: Is Benjamini-Hochberg procedure applied per metric?
        benjaminiPrimaryMetricsOnly:
          type: boolean
          description: Is Benjamini-Hochberg procedure applied for primary metrics only?
        defaultConfidenceInterval:
          type: string
          enum:
          - '80'
          - '90'
          - '95'
          - '98'
          - '99'
          description: Default error margin used for results
        defaultRollupWindow:
          type: integer
          description: Default rollup window in days for experiment results. Use -1 for cumulative. Only -1, 1, and 7 allowed for cloud experiments.
          format: int64
        defaultChanceToBeatThreshold:
          type: number
          description: Default chance-to-beat threshold used for Bayesian results.
          format: double
        bayesianPriors:
          type: array
          items:
            type: object
            properties:
              metric:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                required:
                - name
                - type
              priorMean:
                type: number
              priorStdDev:
                type: number
                exclusiveMinimum: 0
            required:
            - metric
            - priorMean
            - priorStdDev
          description: Bayesian prior settings by metric.
        manualQualityScores:
          type: array
          items:
            type: object
            properties:
              criteriaName:
                oneOf:
                - type: string
                  enum:
                  - HYPOTHESIS_LENGTH
                  - BALANCED_EXPOSURE
                  - PRIMARY_METRICS_LENGTH
                  - SECONDARY_METRICS_LENGTH
                  - COMPARISON_CORRECTION
                  - GUARDRAIL_METRIC_TAGS
                  - SUFFICIENT_SAMPLE
                  - POWER_ANALYSIS
                  - SEQUENTIAL_TESTING
                - type: string
              status:
                type: string
                enum:
                - PASSED
                - FAILED
                - WARNING
              criteriaDescription:
                type: string
              score:
                type: number
              weight:
                type: number
            required:
            - criteriaName
            - status
            - criteriaDescription
            - score
            - weight
          description: 'Up to 10 manually set quality scores for an experiment. The scores and weights will be added to the existing weights and scores, and then weights will be renormalized to 100. This can be set via the Statsig Console API. If targeting a default check, the weight of the check will be updated, but not the status or description. A default score can be removed by setting the weight to 0. The default score identifiers are one of: HYPOTHESIS_LENGTH, BALANCED_EXPOSURE, PRIMARY_METRICS_LENGTH, COMPARISON_CORRECTION, GUARDRAIL_METRIC_TAGS, SUFFICIENT_SAMPLE, POWER_ANALYSIS, SEQUENTIAL_TESTING'
        status:
          type: string
          enum:
          - active
          - setup
          - decision_made
          - abandoned
          - archived
          - experiment_stopped
          - assignment_stopped
          description: The current status of the experiment
        launchedGroupID:
          type:
          - string
          - 'null'
          description: ID of the launched group, null otherwise
        assignmentSourceName:
          type: string
          description: Source name of the assignment
        assignmentSourceExperimentName:
          type: string
          description: Name of the source experiment for assignment
        creatorID:
          type:
          - string
          - 'null'
          description: The Statsig ID of the creator of this experiment
        creatorEmail:
          type:
          - string
          - 'null'
          description: The email of the creator of this experiment
        isAnalysisOnly:
          type:
          - boolean
          - 'null'
          description: For Warehouse Native
        team:
          type:
          - string
          - 'null'
          description: The team name associated with the experiment, Enterprise only.
        teamID:
          type:
          - string
          - 'null'
          description: The team ID associated with the experiment, Enterprise only.
        allocationDuration:
          type:
          - integer
          - 'null'
          description: Warehouse Native Only - Allocation duration in days
          format: int64
          exclusiveMinimum: 1
        cohortedAnalysisDuration:
          type: integer
          description: Warehouse Native Only - Cohorted analysis duration in days
          format: int64
          exclusiveMinimum: 1
