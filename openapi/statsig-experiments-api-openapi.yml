                  format: double
                spreadReduction:
                  type: number
                  description: Observed reduction in spread after running stratified sampling.
                  format: double
              required:
              - status
              description: The stratified sampling settings for the experiment
            enabledNonProdEnvironments:
              type: array
              items:
                type: string
          required:
          - description
          - idType
          - hypothesis
          - groups
          - allocation
          - targetingGateID
          - bonferroniCorrection
          - defaultConfidenceInterval
          - status
          description: 'For `update_settings`: the full experiment settings payload, matching the `PATCH /console/v1/experiments/:id` body. Required for `update_settings`. Fields omitted from the payload fall back to the experiment’s current values.'
      required:
