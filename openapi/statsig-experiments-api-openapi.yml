          type: string
          enum:
          - frequentist
          - bayesian
          - sprt
          description: The mode of analysis for the experiment, e.g frequentist, bayesian, sprt
        defaultSPRTPowerParam:
          type: number
          description: SPRT power parameter percentage used as the default for experiment analysis.
          format: double
        defaultSPRTMDE:
          type: number
          description: Default MDE value for every metric if one isn't provided. Only used in manual mode.
          format: double
        sprtBaselineMode:
          type: string
          enum:
          - manual
          - in_experiment_control
          description: In manual mode, mde/mean/stdDev must be provided for every metric in the experiment. In in_experiment_control, only the mde is needed for every metric, or the defaultSPRTMDE field must be passed.
        sprtMDESettings:
          type: array
          items:
            type: object
            properties:
              metricKey:
                type: string
