        fixedAnalysisDuration:
          type: integer
          description: Fixed analysis duration in days
          format: int64
          exclusiveMinimum: 1
        scheduledReloadHour:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 23
          description: Warehouse Native only - UTC hour at which to run scheduled pulse loads
          format: int64
        scheduledReloadType:
          type: string
          enum:
          - full
          - incremental
          description: Warehouse Native only - reload type for scheduled reloads
        scheduledReloadDays:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Warehouse Native only - days on which to run scheduled reloads from 0 to 6, 0 meaning Sunday. Null to run reloads on all days.
        turboMode:
          type: boolean
          description: Warehouse Native only - whether to run scheduled reloads with Turbo mode.
        autoLoadToplineImpact:
          type: boolean
          description: Warehouse Native only - whether to automatically run topline and projected launch impact calculations when reloading experiments.
        analysisEndTime:
          type: string
          description: Warehouse Native only - end time for analysis only experiments
        assignmentSourceFilters:
          type: array
          items:
            type: object
            properties:
              column:
                type: string
                description: Column to filter on.
              condition:
                type: string
                enum:
                - in
                - not_in
                - '='
                - '>'
                - <
                - '>='
                - <=
                - is_null
                - non_null
                - contains
                - not_contains
                - sql_filter
                - starts_with
                - ends_with
                - after_exposure
                - before_exposure
                - is_true
                - is_false
              values:
                type: array
                items:
                  type: string
                description: Optional array of values for the criterion to match against.
            required:
            - condition
          description: Array of criteria for filtering assignment sources.
        analyticsType:
          type: string
          enum:
          - frequentist
          - bayesian
          - sprt
          description: The mode of analysis for the experiment, e.g frequentist, bayesian, sprt
        defaultSPRTPowerParam:
          type: number
          description: SPRT power parameter percentage used as the default for experiment analysis.
          format: double
        defaultSPRTMDE:
          type: number
          description: Default MDE value for every metric if one isn't provided. Only used in manual mode.
          format: double
        sprtBaselineMode:
          type: string
          enum:
          - manual
          - in_experiment_control
          description: In manual mode, mde/mean/stdDev must be provided for every metric in the experiment. In in_experiment_control, only the mde is needed for every metric, or the defaultSPRTMDE field must be passed.
        sprtMDESettings:
          type: array
          items:
            type: object
            properties:
              metricKey:
                type: string
              groupSettings:
                type: array
                items:
                  type: object
                  properties:
                    groupKey:
                      type: string
                    mde:
                      type: number
                    mean:
                      type: number
                    stdDev:
                      type: number
                  required:
                  - groupKey
                  - mde
            required:
            - metricKey
            - groupSettings
          description: The SPRT values for use in the experiment.
        isSidecar:
          type: boolean
          description: Whether this is a Statsig Sidecar experiment. `sidecarEditorURL`, `sidecarURLFilters`, `sidecarDisableAutoRun`, and `sidecarPrerunScript` are saved only when this is `true`.
        sidecarEditorURL:
          type: string
          description: 'Sidecar (Visual Editor) only: the URL of the page being modified. The Visual Editor cannot open without it, and it must be an `http` or `https` URL.'
        sidecarURLFilters:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - contains
                - equals
                - regex
                - path
              value:
                type: string
            required:
            - type
            - value
          description: 'Sidecar (Visual Editor) only: filters on the current URL used to determine whether the experiment should be applied. Each entry looks like `{ "type": "contains", "value": "/pricing" }`, where `type` is `contains`, `equals`, `regex`, or `path`. Put `type` inside each filter object, not alongside the array.'
        sidecarDisableAutoRun:
