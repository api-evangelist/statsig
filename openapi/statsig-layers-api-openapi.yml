  /console/v1/layers/{id}/overrides/userID/{userID}:
    delete:
      summary: Delete a Single Layer User ID Override
      description: 'Removes a single user ID from the matching layer userID override bucket. Idempotent: returns 200 even when the user ID is not currently overridden. Only clears the bucket named by `experimentName`, `groupName`, `idType`, and `environment`; every other override bucket stays in place. The response body carries the full override set for the layer after the delete.'
      parameters:
      - name: id
        required: true
        in: path
        description: Layer name
        schema:
          type: string
      - name: userID
        required: true
        in: path
        description: User ID to remove from the override
        schema:
          type: string
      - name: groupName
        required: true
        in: query
        description: Experiment group the override targets
        schema:
          example: Control
          type: string
      - name: experimentName
        required: true
        in: query
        description: Experiment within the layer that owns the override
        schema:
          example: my_experiment
          type: string
      - name: idType
        required: false
        in: query
        description: The unit type of the override. Defaults to the experiment unit type when omitted.
        schema:
          type: string
      - name: environment
        required: false
        in: query
        description: Environment the override is scoped to. Omit to target the override that applies to all environments.
        schema:
          type: string
      responses:
        '200':
          description: Delete Single Layer User ID Override Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SingleDataResponse'
                - properties:
                    data:
                      $ref: '#/components/schemas/LayerOverridesDto'
                example:
                  message: Layer Overrides updated successfully.
                  data:
                    conditionalOverrides:
                    - type: gate
                      name: a_gate
                      experimentName: my_experiment
                      groupName: Test
                      environment: null
                    idOverrides:
                    - groupName: Control
                      ids:
                      - user_a
                      idType: userID
                      environment: null
                      experimentName: my_experiment
                    - groupName: Control
                      ids:
                      - user_b
                      idType: userID
                      environment: staging
                      experimentName: my_experiment
                    - groupName: Control
                      ids:
                      - user_b
                      idType: userID
                      environment: null
                      experimentName: another_experiment
              example:
