openapi: 3.2.0
info:
  title: Console Experiments (Warehouse Native) API
  description: The "Console API" is the CRUD API for performing the actions offered on console.statsig.com without needing to go through the web UI.
  version: 20240601.0.0
  contact: {}
servers:
- url: https://statsigapi.net
tags:
- name: Experiments (Warehouse Native)
paths:
  /console/v1/experiments/{id}/load_pulse:
    post:
      summary: Load Pulse (Warehouse Native)
      parameters:
      - name: id
        required: true
        in: path
        description: id
        schema:
          type: string
      - name: refresh
        required: false
        in: query
        schema:
          default: full
          type: string
          enum:
          - full
          - incremental
          - metric
      - name: metricIDs
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
      - name: turboMode
        required: false
        in: query
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchidnaLoadPulseQueryDto'
      responses:
        '200':
          description: Load Pulse Success
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                example:
                  message: Experiment is loading.
              example:
                message: Experiment is loading.
        '400':
          description: Invalid request. Please check the request input and try again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 400
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Request:
                  value:
                    status: 400
                    message: Invalid request. Please check the request input and try again.
        '401':
          description: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    enum:
                    - 401
                  message:
                    type: string
                required:
                - status
                - message
              examples:
                Invalid Endpoint:
                  value:
                    status: 401
                    message: 'This endpoint only accepts an active CONSOLE key, but an invalid key was sent. Key: console-xxxXXXxxxXXXxxx'
      tags:
      - Experiments (Warehouse Native)
      security:
      - STATSIG-API-KEY: []
      operationId: postConsoleV1ExperimentsByIdLoadPulse
      x-operation-id-source: derived
